<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino: Ruleta</title>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #800000 0%, #300000 100%);
            color: #fff; 
            overflow-x: hidden; 
        }
        .vegas-title { font-family: 'Monoton', cursive; text-align: center; font-size: 4rem; margin: 20px 0; text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff0080, 0 0 30px #ff0080, 0 0 40px #ff0080; }
        .roulette-container { position: relative; width: 100%; max-width: 800px; margin: 60px auto 0 auto; }
        #roulette-image { width: 100%; height: auto; display: block; transform-origin: center center; }
        #center-button { position: absolute; top: 50%; left: 50%; width: 15%; height: 15%; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; z-index: 20; }
        #clapper-container { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); transform-origin: top center; z-index: 10; }
        #clapper-image { width: 30px; height: auto; display: block; }
    </style>
</head>
<body>

    <header>
        <h1 class="vegas-title">CASINO: RULETA</h1>
    </header>

    <main class="roulette-container">
        <img src="ruleta.png" alt="Ruleta" id="roulette-image">
        <div id="center-button"></div>
        <div id="clapper-container">
            <img src="lengueta2.png" alt="Lengüeta" id="clapper-image">
        </div>
    </main>

    <!-- Ambos audios cargados -->
    <audio id="loop-sound" src="clicks.mp3" preload="auto"></audio>
    <audio id="single-sound" src="Single-Click.mp3" preload="auto"></audio>

    <script>
        const roulette = document.getElementById('roulette-image');
        const clapper = document.getElementById('clapper-container');
        const loopSound = document.getElementById('loop-sound');
        const singleSound = document.getElementById('single-sound');
        const centerBtn = document.getElementById('center-button');
        
        let angle = 0, velocity = 0, friction = 0.997;
        let hasClicked = false, pressStartTime = 0;
        let ignorePegs = false; // Variable para evitar la vibración
        
        const degreesPerSegment = 360 / 13; 
        const halfSegment = degreesPerSegment / 2;

        centerBtn.addEventListener('mousedown', () => { pressStartTime = Date.now(); });
        
        centerBtn.addEventListener('mouseup', () => {
            let pressDuration = (Date.now() - pressStartTime) / 1000;
            velocity = Math.min(pressDuration * 15, 40);
            if (velocity > 0) {
                ignorePegs = false;
                loopSound.currentTime = 0;
                loopSound.play().catch(() => {});
                requestAnimationFrame(spin);
            }
        });

        function spin() {
            angle += velocity;
            let relativeAngle = (angle + halfSegment) % degreesPerSegment;
            
            if (velocity < 4) loopSound.pause();

            // Solo comprobamos topes si no estamos en modo "ignorar"
            if (!ignorePegs && (relativeAngle < 2.5 || relativeAngle > (degreesPerSegment - 2.5))) {
                
                if (Math.abs(velocity) < 0.4) {
                    velocity = -velocity * 0.4; // Rebote suave
                    ignorePegs = true;          // Ignoramos los topes un momento
                    
                    // Reactivamos los topes tras 300ms
                    setTimeout(() => { ignorePegs = false; }, 300);
                } else {
                    velocity *= 0.99;
                    clapper.style.transform = 'translateX(-50%) rotate(-20deg)'; 
                    
                    if (!hasClicked) {
                        if (velocity < 4) {
                            singleSound.currentTime = 0;
                            singleSound.play().catch(() => {});
                        }
                        hasClicked = true;
                    }
                }
            } else {
                velocity *= friction;
                clapper.style.transform = 'translateX(-50%) rotate(0deg)';
                hasClicked = false;
            }

            roulette.style.transform = `rotate(${angle}deg)`;

            if (Math.abs(velocity) > 0.02) {
                requestAnimationFrame(spin);
            } else {
                loopSound.pause();
                clapper.style.transform = 'translateX(-50%) rotate(0deg)';
            }
        }

        function checkNaturalStop() {
            let relativeAngle = (angle + halfSegment) % degreesPerSegment;
            if (relativeAngle < 3 || relativeAngle > (degreesPerSegment - 3)) {
                velocity = (relativeAngle < degreesPerSegment / 2) ? -0.5 : 0.5;
                requestAnimationFrame(spin);
            }
        }
    </script>
</body>
</html>
