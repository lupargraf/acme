<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino: Ruleta</title>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: radial-gradient(circle, #800000 0%, #300000 100%); color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .vegas-title { font-family: 'Monoton', cursive; text-align: center; font-size: 3rem; margin: 10px 0; text-shadow: 0 0 5px #fff, 0 0 20px #ff0080; }
        
        .game-container { display: flex; width: 95%; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
        .left-side { width: 60%; position: relative; display: flex; justify-content: center; }
        .right-side { width: 40%; padding-left: 20px; display: flex; flex-direction: column; }
        
        .roulette-wrapper { position: relative; width: 100%; max-width: 800px; }
        #roulette-image { width: 100%; height: auto; display: block; transform-origin: center center; }
        #center-button { position: absolute; top: 50%; left: 50%; width: 15%; height: 15%; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; z-index: 20; }
        #clapper-container { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); transform-origin: top center; z-index: 10; }
        #clapper-image { width: 30px; height: auto; display: block; }

        .mat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #0d3b17; padding: 15px; border: 3px solid #fff; border-radius: 5px; }
        .mat-cell { position: relative; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; border-radius: 5px; }
        .mat-cell.red { background-color: #b30000; }
        .mat-cell.black { background-color: #1a1a1a; }
        
        .mat-cell input, .mat-cell select { width: 90%; background: transparent; border: none; color: #fff; text-align: center; font-size: 0.9rem; }
        .mat-cell select { background-color: #333; border-radius: 3px; }
        .mat-cell.black input::placeholder { color: #444; }
        .mat-cell.red input::placeholder { color: #cc6666; }
        
        .input-top { position: absolute; top: 5px; }
        .input-bottom { position: absolute; bottom: 5px; }

        #winners-section { margin-top: 20px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 5px; min-height: 100px; }
        .winner-header-container { display: flex; justify-content: center; gap: 10px; align-items: center; font-family: 'Monoton', cursive; color: #ffd700; font-size: 1.5rem; }
        
        .winners-grid { display: flex; gap: 20px; margin-top: 10px; }
        .winners-column { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        
        #bank-result { margin-top: 15px; padding-top: 10px; border-top: 2px solid #fff; text-align: center; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1 class="vegas-title">CASINO: RULETA</h1>
    </header>

    <div class="game-container">
        <div class="left-side">
            <div class="roulette-wrapper">
                <img src="ruleta.png" alt="Ruleta" id="roulette-image">
                <div id="center-button"></div>
                <div id="clapper-container"><img src="lengueta2.png" alt="Lengüeta" id="clapper-image"></div>
            </div>
        </div>
        
        <div class="right-side">
            <div class="mat-grid" id="mat"></div>
            <div id="winners-section">
                <div class="winner-header-container">
                    <span>GANA</span>
                    <span id="winner-number"></span>
                </div>
                <div id="winners-list" class="winners-grid"></div>
                <div id="bank-result"></div>
            </div>
        </div>
    </div>

    <audio id="loop-sound" src="clicks.mp3" preload="auto"></audio>
    <audio id="single-sound" src="Single-Click.mp3" preload="auto"></audio>

    <script>
        const roulette = document.getElementById('roulette-image');
        const clapper = document.getElementById('clapper-container');
        const loopSound = document.getElementById('loop-sound');
        const singleSound = document.getElementById('single-sound');
        const centerBtn = document.getElementById('center-button');
        
        const wheelOrder = [0, 5, 9, 12, 6, 3, 1, 8, 4, 11, 7, 2, 10];
        const matOrder = [1, 2, 4, 3, 6, 5, 7, 8, 9, 11, 10, 12];
        const colors = {0:'green', 1:'black', 2:'red', 3:'red', 4:'black', 5:'red', 6:'black', 7:'black', 8:'red', 9:'black', 10:'black', 11:'red', 12:'red'};
        
        let angle = 0, velocity = 0, friction = 0.997, ignorePegs = false;
        const degreesPerSegment = 360 / 13; 
        const halfSegment = degreesPerSegment / 2;

        const mat = document.getElementById('mat');
        matOrder.forEach(num => {
            const cell = document.createElement('div');
            cell.className = `mat-cell ${colors[num]}`;
            
            let options = '<option value="0">0</option>';
            for(let i = 20; i <= 500; i += 20) {
                options += `<option value="${i}">${i}</option>`;
            }

            cell.innerHTML = `<input type="text" maxlength="20" placeholder="JUGADOR" class="input-top" id="jug-${num}"><span>${num}</span><select class="input-bottom" id="bet-${num}">${options}</select>`;
            mat.appendChild(cell);
        });

        centerBtn.addEventListener('mousedown', () => { pressStartTime = Date.now(); });
        centerBtn.addEventListener('mouseup', () => {
            let pressDuration = (Date.now() - pressStartTime) / 1000;
            velocity = Math.min(pressDuration * 15, 40);
            if (velocity > 0) { ignorePegs = false; loopSound.play(); requestAnimationFrame(spin); }
        });

        function spin() {
            angle += velocity;
            let relativeAngle = (angle + halfSegment) % degreesPerSegment;
            if (velocity < 4) loopSound.pause();

            if (!ignorePegs && (relativeAngle < 2.5 || relativeAngle > (degreesPerSegment - 2.5))) {
                if (Math.abs(velocity) < 0.4) {
                    velocity = -velocity * 0.4; ignorePegs = true;
                    setTimeout(() => { ignorePegs = false; }, 300);
                } else {
                    velocity *= 0.99; clapper.style.transform = 'translateX(-50%) rotate(-20deg)'; 
                    if (velocity < 4) singleSound.play();
                }
            } else { velocity *= friction; clapper.style.transform = 'translateX(-50%) rotate(0deg)'; }

            roulette.style.transform = `rotate(${angle}deg)`;
            if (Math.abs(velocity) > 0.02) requestAnimationFrame(spin);
            else { loopSound.pause(); calculateWinners(); }
        }

        function calculateWinners() {
            let normalizedAngle = (angle % 360 + 360) % 360;
            let currentSegment = Math.round(normalizedAngle / degreesPerSegment) % 13;
            if(currentSegment !== 0) currentSegment = 13 - currentSegment;
            
            const winNum = wheelOrder[currentSegment];
            
            document.getElementById('winner-number').innerText = `EL ${winNum}`;
            const list = document.getElementById('winners-list');
            const bankResult = document.getElementById('bank-result');
            list.innerHTML = '';
            bankResult.innerHTML = '';
            
            let totalBets = 0;
            let totalPrizes = 0;

            matOrder.forEach(num => {
                const bet = parseFloat(document.getElementById(`bet-${num}`).value);
                if(bet) totalBets += bet;
            });

            if(winNum === 0) { 
                list.innerHTML = '<div style="width:100%;font-size:2rem;color:red;text-align:center;">LA BANCA</div>'; 
                bankResult.innerText = `LA BANCA GANA: $${totalBets}`;
                return; 
            }

            // Obtener vecinos
            const winIndex = wheelOrder.indexOf(winNum);
            const prevNum = wheelOrder[(winIndex - 1 + 13) % 13];
            const nextNum = wheelOrder[(winIndex + 1) % 13];

            let winners = [];
            matOrder.forEach(num => {
                const jug = document.getElementById(`jug-${num}`).value;
                let bet = parseFloat(document.getElementById(`bet-${num}`).value);
                if(!jug || !bet) return;

                let prize = 0;
                const sameColor = colors[num] === colors[winNum];
                const sameParity = (num % 2) === (winNum % 2);

                if(num === winNum) {
                    prize = bet * 10;
                } else if(num === prevNum || num === nextNum) {
                    prize = bet * 2; // Vecinos ganan el doble
                } else if(sameColor && sameParity) {
                    prize = bet; // Recupera lo apostado
                } else if(sameColor || sameParity) {
                    prize = bet * 0.5; // La mitad
                }

                totalPrizes += prize;
                winners.push({ name: jug, prize: prize });
            });

            winners.sort((a, b) => b.prize - a.prize);

            const col1 = document.createElement('div');
            col1.className = 'winners-column';
            const col2 = document.createElement('div');
            col2.className = 'winners-column';

            winners.forEach((w, index) => {
                const div = document.createElement('div');
                div.innerText = `${w.name}: +$${w.prize}`;
                if(index < 6) col1.appendChild(div);
                else col2.appendChild(div);
            });

            list.appendChild(col1);
            list.appendChild(col2);

            const bankBalance = totalBets - totalPrizes;
            if(bankBalance >= 0) {
                bankResult.style.color = '#00ff00';
                bankResult.innerText = `LA BANCA GANA: $${bankBalance}`;
            } else {
                bankResult.style.color = '#ff4444';
                bankResult.innerText = `LA BANCA PIERDE: $${Math.abs(bankBalance)}`;
            }
        }
    </script>
</body>
</html>
