<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino: Ruleta</title>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff; overflow-x: hidden;
        }
        .vegas-title {
            font-family: 'Monoton', cursive; text-align: center; font-size: 4rem; margin: 20px 0;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ff0080, 0 0 30px #ff0080, 0 0 40px #ff0080;
        }
        .roulette-container {
            position: relative; width: 100%; display: flex; flex-direction: column; align-items: center;
        }
        #roulette-image {
            width: 100%; max-width: 800px; height: auto; transform-origin: center center;
        }
        #clapper-container {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            transform-origin: top center; z-index: 10;
        }
        #clapper-image { width: 30px; height: auto; }
        #puller {
            width: 50px; height: 100px; background-color: #d32f2f; border-radius: 10px;
            position: absolute; bottom: -50px; cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="vegas-title">CASINO: RULETA</h1>
    </header>

    <main class="roulette-container">
        <!-- Ruta relativa a la ruleta -->
        <img src="https://lupargraf.github.io/acme/ruleta.png" alt="Ruleta" id="roulette-image">
        
        <div id="clapper-container">
            <!-- Ruta relativa a la lengüeta -->
            <img src="https://lupargraf.github.io/acme/lengueta.png" alt="Lengüeta" id="clapper-image">
        </div>
        
        <div id="puller"></div>
    </main>

    <!-- Ruta relativa al sonido -->
    <audio id="click-sound" src="https://lupargraf.github.io/acme/Single-Click.mp3" preload="auto"></audio>

    <script>
        const roulette = document.getElementById('roulette-image');
        const clapper = document.getElementById('clapper-container');
        const clickSound = document.getElementById('click-sound');
        
        let angle = 0, velocity = 0, friction = 0.985;
        let isDragging = false, startY = 0, hasClicked = false;
        const degreesPerSegment = 30;

        document.getElementById('puller').addEventListener('mousedown', (e) => { isDragging = true; startY = e.clientY; });
        
        window.addEventListener('mousemove', (e) => { if (!isDragging) return; });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return; isDragging = false;
            let pullDistance = Math.max(0, e.clientY - startY);
            velocity = Math.min(pullDistance / 10, 20);
            if (velocity > 0) requestAnimationFrame(spin);
        });

        function spin() {
            angle += velocity;
            let relativeAngle = angle % degreesPerSegment;
            
            if (relativeAngle < 3 || relativeAngle > 27) {
                velocity *= 0.92;
                clapper.style.transform = 'translateX(-50%) rotate(20deg)';
                if (!hasClicked) {
                    clickSound.currentTime = 0; clickSound.play().catch(() => {});
                    hasClicked = true;
                }
            } else {
                velocity *= friction;
                clapper.style.transform = 'translateX(-50%) rotate(0deg)';
                hasClicked = false;
            }

            roulette.style.transform = `rotate(${angle}deg)`;

            if (velocity > 0.05) requestAnimationFrame(spin);
            else snapToNearestNumber();
        }

        function snapToNearestNumber() {
            angle = Math.round(angle / degreesPerSegment) * degreesPerSegment;
            roulette.style.transform = `rotate(${angle}deg)`;
        }
    </script>
</body>
</html>
