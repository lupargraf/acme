<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos - Club Montañero de Estudiantes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 2rem;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon-acme.svg">
    <link rel="apple-touch-icon" href="favicon-acme.svg">
</head>
<body>
    <h1>Club Montañero de Estudiantes</h1>
    <div class="container">
        <a href="https://lupargraf.github.io/acme/Ruleta/" class="btn">Ruleta</a>
        <a href="https://lupargraf.github.io/acme/Bingo/" class="btn">Bingo</a>
    </div>
</body>
</html>
