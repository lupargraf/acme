<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRÁFICA SOLAR</title>

  <!-- Librerías externas vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    @font-face {
      font-family: 'AbelCustom';
      src: url('https://lupargraf.github.io/acme/Solar/Abel-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'AbelCustom', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1280px;
      padding: 20px 24px 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      font-weight: normal;
      color: #ffffff;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.control-label {
      font-size: 0.95rem;
      color: #cccccc;
    }

    select.bg-select {
      background-color: #111111;
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      padding: 8px 12px;
      font-family: 'AbelCustom', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
    }

    select.bg-select:hover,
    select.bg-select:focus {
      border-color: #ffffff;
    }

    .secondary-btn {
      background-color: rgba(255, 255, 255, 0.08);
      color: #eeeeee;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      font-family: 'AbelCustom', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .secondary-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .sr-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 6px 16px;
      font-size: 0.95rem;
      color: #dddddd;
      z-index: 10;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      display: inline-block;
      border-radius: 2px;
    }

    /* Relación de aspecto exacta 1.08 : 1 */
    #chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 1134px;
      aspect-ratio: 1.08 / 1;
      margin: 10px auto 30px;
      background-color: #000000;
      background-image: url('https://lupargraf.github.io/acme/Solar/fondosolar.jpg');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bar-label {
      font-family: 'AbelCustom', sans-serif;
      pointer-events: none;
      dominant-baseline: central;
      letter-spacing: 0.3px;
    }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    #status-msg {
      font-size: 0.95rem;
      color: #aaaaaa;
      text-align: center;
      margin-top: 4px;
      padding: 0 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>GRÁFICA SOLAR</h1>
    <div class="controls">
      <div class="control-group">
        <label for="bg-select" class="control-label">Fondo:</label>
        <select id="bg-select" class="bg-select" aria-label="Elegir fondo de la gráfica">
          <option value="black">negro</option>
          <option value="navy">azul marino</option>
          <option value="darkgreen">verde oscuro</option>
          <option value="purple">morado</option>
          <option value="maroon">granate</option>
          <option value="coffee">café</option>
          <option value="cme" selected>Fondo CME</option>
          <option value="custom">Subir imagen...</option>
        </select>
        <button type="button" id="upload-bg-btn" class="secondary-btn" title="Elegir una imagen de fondo desde el equipo">Subir imagen</button>
        <input type="file" id="bg-file-input" class="sr-file-input" accept="image/*" />
      </div>

      <button type="button" id="load-file-btn" class="secondary-btn" title="Cargar tabla desde archivo Excel o CSV">Cargar archivo</button>
      <input type="file" id="table-file-input" class="sr-file-input" accept=".xlsx, .xls, .csv" />

      <button type="button" id="load-url-btn" class="secondary-btn" title="Cargar tabla desde una URL">Cargar URL</button>
      <button type="button" id="download-svg-btn" class="secondary-btn" title="Descargar gráfico en alta calidad">Descargar PNG</button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="legend-color" style="background:#FFED00;"></span> Nivel 0</div>
    <div class="legend-item"><span class="legend-color" style="background:#F39200;"></span> Nivel 1</div>
    <div class="legend-item"><span class="legend-color" style="background:#1D71B8;"></span> Nivel 2</div>
    <div class="legend-item"><span class="legend-color" style="background:#3AAA35;"></span> Nivel 3</div>
    <div class="legend-item"><span class="legend-color" style="background:#BE1622;"></span> Nivel 4</div>
  </div>

  <div id="status-msg">Importando tabla desde MiCloud Movistar...</div>

  <div id="chart-wrapper">
    <svg id="solar-chart" viewBox="0 0 1080 1000" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div id="tooltip"></div>

  <script>
    const LEVEL_COLORS = {
      0: '#FFED00',
      1: '#F39200',
      2: '#1D71B8',
      3: '#3AAA35',
      4: '#BE1622'
    };

    const SOLID_BACKGROUNDS = {
      black: '#000000',
      navy: '#081838',
      darkgreen: '#0B2E1A',
      purple: '#240C38',
      maroon: '#3B0914',
      coffee: '#2B160C'
    };

    const FONT_URL = 'https://lupargraf.github.io/acme/Solar/Abel-Regular.ttf';
    const CME_BG_URL = 'https://lupargraf.github.io/acme/Solar/fondosolar.jpg';
    const DEFAULT_TABLE_URL = 'https://micloud.movistar.es/share/NE4SFGSGUMRGDGIY';

    let currentBgMode = 'cme';
    let currentBgDataUrl = null;
    let previousBgMode = 'cme';

    const SAMPLE_DATA = [
      { nivel: 0, nombre: 'Chema Martínez Sanz', puntuacion: 74 },
      { nivel: 0, nombre: 'Luis Martínez Sanz', puntuacion: 74 },
      { nivel: 1, nombre: 'Alejandro Capilla Jiménez', puntuacion: 50 },
      { nivel: 1, nombre: 'Alejandro Velasco', puntuacion: 23 },
      { nivel: 1, nombre: 'César Milena', puntuacion: 182 },
      { nivel: 1, nombre: 'Curro Jiménez Jiménez', puntuacion: 50 },
      { nivel: 1, nombre: 'Edu Pons Rivero', puntuacion: 261 },
      { nivel: 2, nombre: 'Adrián Fernández Hernando', puntuacion: 241 },
      { nivel: 2, nombre: 'Alberto Sánchez Martí', puntuacion: 182 },
      { nivel: 2, nombre: 'Álvaro Menéndez Gutiérrez', puntuacion: 50 },
      { nivel: 2, nombre: 'Ángel Cerezo Gámez', puntuacion: 70 },
      { nivel: 2, nombre: 'Fernando Arredondo Camacho', puntuacion: 223 },
      { nivel: 2, nombre: 'Fernando Fernández Joya', puntuacion: 50 },
      { nivel: 3, nombre: 'Alberto Garófano Outón', puntuacion: 193 },
      { nivel: 3, nombre: 'Álvaro González de Santa Ana', puntuacion: 341 },
      { nivel: 3, nombre: 'Álvaro Rodríguez Aguado', puntuacion: 70 },
      { nivel: 3, nombre: 'Anatole Esipov', puntuacion: 50 },
      { nivel: 3, nombre: 'Ángel Ruiz Martínez', puntuacion: 229 },
      { nivel: 3, nombre: 'Antonio Escudero de Paz', puntuacion: 50 },
      { nivel: 3, nombre: 'Carlos de Santa Ana Calvo', puntuacion: 70 },
      { nivel: 3, nombre: 'Enrique Escudero de Paz', puntuacion: 50 },
      { nivel: 4, nombre: 'Rodrigo Fajardo Jiménez', puntuacion: 50 },
      { nivel: 4, nombre: 'David Hurley', puntuacion: 15 },
      { nivel: 4, nombre: 'Agustín González Vallone', puntuacion: 418 },
      { nivel: 4, nombre: 'Alfonso Sánchez Vega', puntuacion: 358 },
    ];

    const svg = d3.select('#solar-chart');
    const tooltip = d3.select('#tooltip');
    const chartWrapper = document.getElementById('chart-wrapper');
    const statusMsg = document.getElementById('status-msg');
    const bgSelect = document.getElementById('bg-select');
    const uploadBgBtn = document.getElementById('upload-bg-btn');
    const bgFileInput = document.getElementById('bg-file-input');
    const tableFileInput = document.getElementById('table-file-input');

    function applyBackground(mode, customDataUrl = null) {
      if (SOLID_BACKGROUNDS[mode]) {
        currentBgMode = mode;
        previousBgMode = mode;
        currentBgDataUrl = null;
        chartWrapper.style.backgroundColor = SOLID_BACKGROUNDS[mode];
        chartWrapper.style.backgroundImage = 'none';
      } else if (mode === 'custom' && customDataUrl) {
        currentBgMode = 'custom';
        previousBgMode = 'custom';
        currentBgDataUrl = customDataUrl;
        chartWrapper.style.backgroundColor = '#000000';
        chartWrapper.style.backgroundImage = `url("${customDataUrl}")`;
      } else {
        currentBgMode = 'cme';
        previousBgMode = 'cme';
        currentBgDataUrl = null;
        chartWrapper.style.backgroundColor = '#000000';
        chartWrapper.style.backgroundImage = `url("${CME_BG_URL}")`;
      }
    }

    function openCustomBackgroundPicker() {
      bgFileInput.value = '';
      if (typeof bgFileInput.showPicker === 'function') {
        try {
          bgFileInput.showPicker();
          return;
        } catch (err) {
          // Fallback a click() si showPicker no está permitido por el navegador
        }
      }
      bgFileInput.click();
    }

    bgSelect.addEventListener('change', function() {
      const val = this.value;
      if (val === 'custom') {
        if (currentBgDataUrl) {
          applyBackground('custom', currentBgDataUrl);
        }
        setTimeout(openCustomBackgroundPicker, 0);
      } else {
        applyBackground(val);
      }
    });

    uploadBgBtn.addEventListener('click', function() {
      bgSelect.value = 'custom';
      openCustomBackgroundPicker();
    });

    bgFileInput.addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) {
        bgSelect.value = currentBgMode === 'custom' && currentBgDataUrl ? 'custom' : previousBgMode;
        return;
      }
      const reader = new FileReader();
      reader.onload = function(evt) {
        applyBackground('custom', evt.target.result);
        bgSelect.value = 'custom';
        statusMsg.textContent = `Fondo personalizado "${file.name}" aplicado.`;
      };
      reader.readAsDataURL(file);
    });

    function measureSvgTextWidth(text, fontSize) {
      const tempText = svg.append('text')
        .attr('class', 'bar-label')
        .attr('font-family', "'AbelCustom', sans-serif")
        .attr('font-size', `${fontSize}px`)
        .attr('letter-spacing', '0.3px')
        .style('opacity', 0)
        .text(text);
      const width = tempText.node().getComputedTextLength();
      tempText.remove();
      return width;
    }

    function renderSolarChart(rawData) {
      svg.selectAll('*').remove();

      if (!rawData || rawData.length === 0) {
        statusMsg.textContent = 'No se encontraron registros válidos en la tabla.';
        return;
      }

      const data = rawData
        .map((d, idx) => ({ ...d, originalIndex: idx }))
        .sort((a, b) => (a.nivel - b.nivel) || (a.originalIndex - b.originalIndex));

      const width = 1080;
      const height = 1000;
      const cx = width / 2;
      const cy = height / 2;

      const innerRadius = 56;
      const maxOuterRadius = 475;

      const maxScore = d3.max(data, d => d.puntuacion) || 100;

      const rScale = d3.scaleLinear()
        .domain([0, maxScore])
        .range([innerRadius, maxOuterRadius]);

      const n = data.length;
      const totalAngle = 2 * Math.PI;
      const stepAngle = totalAngle / n;
      const barAngle = stepAngle / 1.1;

      const innerArcWidth = innerRadius * barAngle;
      const fontSize = Math.max(6.5, Math.min(12.5, innerArcWidth * 1.45));

      const g = svg.append('g')
        .attr('transform', `translate(${cx}, ${cy})`);

      g.append('circle')
        .attr('r', innerRadius - 1)
        .attr('fill', '#000000');

      const arcGenerator = d3.arc()
        .innerRadius(innerRadius)
        .outerRadius(d => rScale(d.puntuacion))
        .startAngle((d, i) => i * stepAngle)
        .endAngle((d, i) => i * stepAngle + barAngle);

      g.selectAll('.bar')
        .data(data)
        .enter()
        .append('path')
        .attr('class', 'bar')
        .attr('d', arcGenerator)
        .attr('fill', d => LEVEL_COLORS[d.nivel] || '#FFFFFF')
        .style('cursor', 'pointer')
        .on('mouseover', function(event, d) {
          d3.select(this).style('opacity', 0.85);
          tooltip
            .style('opacity', 1)
            .html(`<strong>${d.nombre}</strong><br/>Nivel ${d.nivel} · Puntuación: ${d.puntuacion}`);
        })
        .on('mousemove', function(event) {
          tooltip
            .style('left', `${event.clientX + 14}px`)
            .style('top', `${event.clientY - 20}px`);
        })
        .on('mouseout', function() {
          d3.select(this).style('opacity', 1);
          tooltip.style('opacity', 0);
        });

      data.forEach((d, i) => {
        const midAngle = i * stepAngle + barAngle / 2;
        const barOuterR = rScale(d.puntuacion);
        const barLength = barOuterR - innerRadius;

        const normalizedAngle = ((midAngle % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
        const isRightHalf = normalizedAngle < Math.PI;

        const labelText = isRightHalf
          ? `${d.nombre} ${d.puntuacion}`
          : `${d.puntuacion} ${d.nombre}`;

        const textWidth = measureSvgTextWidth(labelText, fontSize);
        const padding = 5;
        const fitsInside = barLength > (textWidth + padding * 2);

        const textColor = (d.nivel === 0 && fitsInside) ? '#000000' : '#ffffff';

        const angleDeg = (normalizedAngle * 180 / Math.PI) - 90;

        let radiusPos;
        let textAnchor;
        let finalRotation;

        if (isRightHalf) {
          finalRotation = angleDeg;
          if (fitsInside) {
            radiusPos = barOuterR - padding;
            textAnchor = 'end';
          } else {
            radiusPos = barOuterR + padding;
            textAnchor = 'start';
          }
        } else {
          finalRotation = angleDeg + 180;
          if (fitsInside) {
            radiusPos = barOuterR - padding;
            textAnchor = 'start';
          } else {
            radiusPos = barOuterR + padding;
            textAnchor = 'end';
          }
        }

        const x = Math.sin(normalizedAngle) * radiusPos;
        const y = -Math.cos(normalizedAngle) * radiusPos;

        g.append('text')
          .attr('class', 'bar-label')
          .attr('transform', `translate(${x}, ${y}) rotate(${finalRotation})`)
          .attr('text-anchor', textAnchor)
          .attr('dominant-baseline', 'central')
          .attr('fill', textColor)
          .attr('font-family', "'AbelCustom', sans-serif")
          .attr('font-size', `${fontSize}px`)
          .attr('letter-spacing', '0.3px')
          .text(labelText);
      });
    }

    function parseWorkbookFirstThreeCols(arrayBuffer) {
      const data = new Uint8Array(arrayBuffer);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
      if (!rows || rows.length === 0) return [];

      const parsed = [];

      const firstRow = rows[0] || [];
      const col1First = String(firstRow[0] ?? '').trim().toLowerCase();
      const col2First = String(firstRow[1] ?? '').trim().toLowerCase();
      const startRowIndex = (col1First === 'nivel' || col2First === 'nombre') ? 1 : 0;

      for (let r = startRowIndex; r < rows.length; r++) {
        const row = rows[r] || [];
        const rawNivel = row[0];
        const rawNombre = row[1];
        const rawPuntuacion = row[2];

        const nombre = String(rawNombre ?? '').trim();

        if (!nombre) {
          break;
        }

        const nivelNum = Number(String(rawNivel ?? '').trim().replace(',', '.'));
        const nivel = Number.isInteger(nivelNum) ? nivelNum : Math.trunc(nivelNum);
        const puntuacion = parseFloat(String(rawPuntuacion ?? '0').replace(',', '.'));

        if (!isNaN(nivel) && nivel >= 0 && nivel <= 4) {
          parsed.push({
            nivel,
            nombre,
            puntuacion: isNaN(puntuacion) ? 0 : puntuacion
          });
        }
      }

      return parsed;
    }

    function looksLikeHtml(buffer) {
      const sample = new TextDecoder('utf-8', { fatal: false }).decode(buffer.slice(0, 512)).trim().toLowerCase();
      return sample.startsWith('<!doctype html') || sample.startsWith('<html') || sample.includes('<body');
    }

    async function fetchTableFromUrl(targetUrl, sourceLabel = 'URL') {
      const cleanUrl = String(targetUrl || '').trim();
      if (!cleanUrl) return;

      statusMsg.textContent = `Importando tabla desde ${sourceLabel}...`;

      const baseCandidates = cleanUrl.includes('micloud.movistar.es/share/')
        ? [cleanUrl.endsWith('/download') ? cleanUrl : `${cleanUrl}/download`, cleanUrl]
        : [cleanUrl];

      const candidates = [];
      for (const u of baseCandidates) {
        candidates.push(u);
        if (/^https?:\/\//i.test(u)) {
          candidates.push(`https://corsproxy.io/?${encodeURIComponent(u)}`);
        }
      }

      let receivedHtml = false;

      for (const url of candidates) {
        try {
          const response = await fetch(url, { mode: 'cors' });
          if (!response.ok) continue;

          const contentType = (response.headers.get('content-type') || '').toLowerCase();
          const buffer = await response.arrayBuffer();

          if (contentType.includes('text/html') || looksLikeHtml(buffer)) {
            receivedHtml = true;
            continue;
          }

          const rows = parseWorkbookFirstThreeCols(buffer);
          if (rows.length > 0) {
            statusMsg.textContent = `Tabla importada desde ${sourceLabel} (${rows.length} registros).`;
            renderSolarChart(rows);
            return;
          }
        } catch (err) {
          // Probar siguiente candidato
        }
      }

      statusMsg.textContent = receivedHtml
        ? `La URL devolvió una página web (HTML) y no un archivo directo. Usa "Cargar archivo" o un enlace directo al Excel/CSV. Mostrando datos de muestra.`
        : `No se pudo leer la tabla desde ${sourceLabel} (restricción de red/CORS o enlace no directo). Mostrando datos de muestra.`;
      renderSolarChart(SAMPLE_DATA);
    }

    document.getElementById('load-file-btn').addEventListener('click', () => {
      tableFileInput.value = '';
      tableFileInput.click();
    });

    tableFileInput.addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const rows = parseWorkbookFirstThreeCols(evt.target.result);
          if (rows.length > 0) {
            statusMsg.textContent = `Archivo "${file.name}" cargado (${rows.length} registros).`;
            renderSolarChart(rows);
          } else {
            statusMsg.textContent = `No se encontraron datos válidos en las 3 primeras columnas de "${file.name}".`;
          }
        } catch (err) {
          console.error(err);
          statusMsg.textContent = `Error al leer el archivo "${file.name}".`;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('load-url-btn').addEventListener('click', () => {
      const urlInput = window.prompt('Introduce la URL directa del archivo Excel o CSV:', DEFAULT_TABLE_URL);
      if (urlInput !== null && urlInput.trim() !== '') {
        document.fonts.ready.then(() => fetchTableFromUrl(urlInput.trim(), 'URL'));
      }
    });

    async function getEmbeddedFontCss() {
      try {
        const response = await fetch(FONT_URL);
        if (!response.ok) return '';
        const blob = await response.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            resolve(`
              @font-face {
                font-family: 'AbelCustom';
                src: url('${reader.result}') format('truetype');
                font-weight: normal;
                font-style: normal;
              }
            `);
          };
          reader.onerror = () => resolve('');
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return '';
      }
    }

    document.getElementById('download-svg-btn').addEventListener('click', async function() {
      const btn = this;
      const originalText = btn.textContent;
      btn.textContent = 'Generando PNG...';
      btn.disabled = true;

      try {
        const svgElement = document.getElementById('solar-chart');
        const clonedSvg = svgElement.cloneNode(true);

        clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clonedSvg.setAttribute('width', '2160');
        clonedSvg.setAttribute('height', '2000');

        const fontCss = await getEmbeddedFontCss();
        if (fontCss) {
          const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = fontCss;
          defs.appendChild(styleEl);
          clonedSvg.insertBefore(defs, clonedSvg.firstChild);
        }

        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(clonedSvg);

        const canvas = document.createElement('canvas');
        canvas.width = 2160;
        canvas.height = 2000;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = SOLID_BACKGROUNDS[currentBgMode] || '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const drawSvgOnCanvas = () => {
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = function() {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            const link = document.createElement('a');
            link.download = 'grafica-solar.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            btn.textContent = originalText;
            btn.disabled = false;
          };
          img.onerror = function() {
            URL.revokeObjectURL(url);
            btn.textContent = originalText;
            btn.disabled = false;
          };
          img.src = url;
        };

        if (SOLID_BACKGROUNDS[currentBgMode]) {
          drawSvgOnCanvas();
        } else {
          const bgSource = (currentBgMode === 'custom' && currentBgDataUrl)
            ? currentBgDataUrl
            : CME_BG_URL;

          const bgImg = new Image();
          if (!bgSource.startsWith('data:')) {
            bgImg.crossOrigin = 'anonymous';
          }
          bgImg.onload = function() {
            ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            drawSvgOnCanvas();
          };
          bgImg.onerror = function() {
            drawSvgOnCanvas();
          };
          bgImg.src = bgSource;
        }
      } catch (err) {
        console.error(err);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });

    document.fonts.ready.then(() => {
      applyBackground('cme');
      fetchTableFromUrl(DEFAULT_TABLE_URL, 'MiCloud');
    });
  </script>
</body>
</html>
