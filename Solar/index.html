<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>GRÁFICA SOLAR</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    @font-face {
      font-family: 'AbelCustom';
      src: url('https://lupargraf.github.io/acme/Solar/Abel-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'AbelCustom', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1200px;
      padding: 20px 24px 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      font-weight: normal;
      color: #ffffff;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .upload-btn {
      background-color: transparent;
      color: #ffffff;
      border: 1.5px solid #ffffff;
      padding: 10px 22px;
      font-family: 'AbelCustom', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: lowercase;
    }

    .upload-btn:hover {
      background-color: #ffffff;
      color: #000000;
    }

    .secondary-btn {
      background-color: rgba(255, 255, 255, 0.08);
      color: #cccccc;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 16px;
      font-family: 'AbelCustom', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .secondary-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    input[type="file"] {
      display: none;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 6px 16px;
      font-size: 0.95rem;
      color: #dddddd;
      z-index: 10;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      display: inline-block;
      border-radius: 2px;
    }

    /* Relación de aspecto exacta 1.08 : 1 */
    #chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 1134px;
      aspect-ratio: 1.08 / 1;
      margin: 10px auto 30px;
      background-color: #000000;
      background-image: url('https://lupargraf.github.io/acme/Solar/fondosolar.jpg');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bar-label {
      font-family: 'AbelCustom', sans-serif;
      fill: #ffffff;
      pointer-events: none;
      dominant-baseline: central;
      letter-spacing: 0.3px;
    }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    #status-msg {
      font-size: 0.95rem;
      color: #aaaaaa;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>

    const svg = d3.select('#solar-chart');
    const tooltip = d3.select('#tooltip');
    const statusMsg = document.getElementById('status-msg');

    function measureSvgTextWidth(text, fontSize) {
      const tempText = svg.append('text')
        .attr('class', 'bar-label')
        .attr('font-family', "'AbelCustom', sans-serif")
        .attr('font-size', `${fontSize}px`)
        .attr('letter-spacing', '0.3px')
        .style('opacity', 0)
        .text(text);
      const width = tempText.node().getComputedTextLength();
      tempText.remove();
      return width;
    }

    function renderSolarChart(rawData) {
      svg.selectAll('*').remove();

      if (!rawData || rawData.length === 0) {
        statusMsg.textContent = 'No se encontraron registros válidos en el archivo.';
        return;
      }

      const data = rawData
        .map((d, idx) => ({ ...d, originalIndex: idx }))
        .sort((a, b) => a.nivel - b.nivel || a.originalIndex - b.originalIndex);

      // Dimensiones con proporción exacta 1.08 x 1
      const width = 1080;
      const height = 1000;
      const cx = width / 2;
      const cy = height / 2;

      const innerRadius = 56;
      const maxOuterRadius = 475;

      const maxScore = d3.max(data, d => d.puntuacion) || 100;

      const rScale = d3.scaleLinear()
        .domain([0, maxScore])
        .range([innerRadius, maxOuterRadius]);

      const n = data.length;
      const totalAngle = 2 * Math.PI;
      const stepAngle = totalAngle / n;
      const barAngle = stepAngle / 1.1;

      const innerArcWidth = innerRadius * barAngle;
      const fontSize = Math.max(6.5, Math.min(12.5, innerArcWidth * 1.45));

      const g = svg.append('g')
        .attr('transform', `translate(${cx}, ${cy})`);

      g.append('circle')
        .attr('r', innerRadius - 1)
        .attr('fill', '#000000');

      const arcGenerator = d3.arc()
        .innerRadius(innerRadius)
        .outerRadius(d => rScale(d.puntuacion))
        .startAngle((d, i) => i * stepAngle)
        .endAngle((d, i) => i * stepAngle + barAngle);

      g.selectAll('.bar')
        .data(data)
        .enter()
        .append('path')
        .attr('class', 'bar')
        .attr('d', arcGenerator)
        .attr('fill', d => LEVEL_COLORS[d.nivel] || '#FFFFFF')
        .style('cursor', 'pointer')
        .on('mouseover', function(event, d) {
          d3.select(this).style('opacity', 0.85);
          tooltip
            .style('opacity', 1)
            .html(`<strong>${d.nombre}</strong><br/>Nivel ${d.nivel} · Puntuación: ${d.puntuacion}`);
        })
        .on('mousemove', function(event) {
          tooltip
            .style('left', `${event.clientX + 14}px`)
            .style('top', `${event.clientY - 20}px`);
        })
        .on('mouseout', function() {
          d3.select(this).style('opacity', 1);
          tooltip.style('opacity', 0);
        });

      data.forEach((d, i) => {
        const midAngle = i * stepAngle + barAngle / 2;
        const barOuterR = rScale(d.puntuacion);
        const barLength = barOuterR - innerRadius;

        const normalizedAngle = ((midAngle % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
        const isRightHalf = normalizedAngle < Math.PI;

        const labelText = isRightHalf
          ? `${d.nombre} ${d.puntuacion}`
          : `${d.puntuacion} ${d.nombre}`;

        const textWidth = measureSvgTextWidth(labelText, fontSize);
        const padding = 5;
        const fitsInside = barLength > (textWidth + padding * 2);

        const angleDeg = (normalizedAngle * 180 / Math.PI) - 90;

        let radiusPos;
        let textAnchor;
        let finalRotation;

        if (isRightHalf) {
          finalRotation = angleDeg;
          if (fitsInside) {
            radiusPos = barOuterR - padding;
            textAnchor = 'end';
          } else {
            radiusPos = barOuterR + padding;
            textAnchor = 'start';
          }
        } else {
          finalRotation = angleDeg + 180;
          if (fitsInside) {
            radiusPos = barOuterR - padding;
            textAnchor = 'start';
          } else {
            radiusPos = barOuterR + padding;
            textAnchor = 'end';
          }
        }

        const x = Math.sin(normalizedAngle) * radiusPos;
        const y = -Math.cos(normalizedAngle) * radiusPos;

        // Atributos explícitos en el SVG para garantizar que el PNG exportado los respete
        g.append('text')
          .attr('class', 'bar-label')
          .attr('transform', `translate(${x}, ${y}) rotate(${finalRotation})`)
          .attr('text-anchor', textAnchor)
          .attr('dominant-baseline', 'central')
          .attr('fill', '#ffffff')
          .attr('font-family', "'AbelCustom', sans-serif")
          .attr('font-size', `${fontSize}px`)
          .attr('letter-spacing', '0.3px')
          .text(labelText);
      });
    }

    function normalizeKey(key) {
      return String(key || '')
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    document.getElementById('excel-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

          const parsedData = [];

          jsonRows.forEach(row => {
            const keys = Object.keys(row);
            let nivelVal = null;
            let nombreVal = '';
            let puntuacionVal = null;

            keys.forEach(k => {
              const nk = normalizeKey(k);
              if (nk.includes('nivel') || nk === 'level') {
                nivelVal = parseInt(row[k], 10);
              } else if (nk.includes('nombre') || nk === 'name') {
                nombreVal = String(row[k]).trim();
              } else if (nk.includes('puntuacion') || nk.includes('puntos') || nk === 'score') {
                const num = parseFloat(String(row[k]).replace(',', '.'));
                puntuacionVal = isNaN(num) ? 0 : num;
              }
            });

            if ((nivelVal === null || isNaN(nivelVal)) && keys.length >= 3) {
              nivelVal = parseInt(row[keys[0]], 10);
              nombreVal = String(row[keys[1]]).trim();
              puntuacionVal = parseFloat(String(row[keys[2]]).replace(',', '.')) || 0;
            }

            if (!isNaN(nivelVal) && nivelVal >= 0 && nivelVal <= 4 && nombreVal !== '') {
              parsedData.push({
                nivel: nivelVal,
                nombre: nombreVal,
                puntuacion: puntuacionVal || 0
              });
            }
          });

          if (parsedData.length > 0) {
            statusMsg.textContent = `Archivo "${file.name}" cargado correctamente (${parsedData.length} registros).`;
            renderSolarChart(parsedData);
          } else {
            statusMsg.textContent = 'Error: Asegúrate de que el Excel tenga las columnas Nivel (0-4), Nombre y Puntuación.';
          }
        } catch (err) {
          console.error(err);
          statusMsg.textContent = 'Error al procesar el archivo Excel. Verifica el formato.';
        }
      };

      reader.readAsArrayBuffer(file);
    });

    // Convierte la fuente externa a Base64 para incrustarla en el SVG exportado
    async function getEmbeddedFontCss() {
      try {
        const response = await fetch(FONT_URL);
        if (!response.ok) return '';
        const blob = await response.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            resolve(`
              @font-face {
                font-family: 'AbelCustom';
                src: url('${reader.result}') format('truetype');
                font-weight: normal;
                font-style: normal;
              }
            `);
          };
          reader.onerror = () => resolve('');
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return '';
      }
    }

    // Exportación a PNG con relación exacta 1.08 x 1 (2160 x 2000 px) y fuente incrustada
    document.getElementById('download-svg-btn').addEventListener('click', async function() {
      const btn = this;
      const originalText = btn.textContent;
      btn.textContent = 'Generando PNG...';
      btn.disabled = true;

      try {
        const svgElement = document.getElementById('solar-chart');
        const clonedSvg = svgElement.cloneNode(true);

        // Asegurar dimensiones y namespaces explícitos en el SVG clonado
        clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clonedSvg.setAttribute('width', '2160');
        clonedSvg.setAttribute('height', '2000');

        // Incrustar @font-face dentro del SVG para que el ancho y estilo del texto sean idénticos
        const fontCss = await getEmbeddedFontCss();
        if (fontCss) {
          const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = fontCss;
          defs.appendChild(styleEl);
          clonedSvg.insertBefore(defs, clonedSvg.firstChild);
        }

        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(clonedSvg);

        const canvas = document.createElement('canvas');
        // Relación exacta ancho x alto = 1.08 x 1
        canvas.width = 2160;
        canvas.height = 2000;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const drawSvgOnCanvas = () => {
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = function() {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            const link = document.createElement('a');
            link.download = 'grafica-solar.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            btn.textContent = originalText;
            btn.disabled = false;
          };
          img.onerror = function() {
            URL.revokeObjectURL(url);
            btn.textContent = originalText;
            btn.disabled = false;
          };
          img.src = url;
        };

        const bgImg = new Image();
        bgImg.crossOrigin = 'anonymous';
        bgImg.onload = function() {
          ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
          drawSvgOnCanvas();
        };
        bgImg.onerror = function() {
          drawSvgOnCanvas();
        };
        bgImg.src = BG_URL;
      } catch (err) {
        console.error(err);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });

    document.fonts.ready.then(() => {
      renderSolarChart(SAMPLE_DATA);
    });
  </script>
</body>
</html>
