<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRÁFICA SOLAR</title>

  <!-- Librerías externas vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.4/dist/svg2pdf.umd.min.js"></script>

  <style>
    @font-face {
      font-family: 'AbelCustom';
      src: url('https://lupargraf.github.io/acme/Solar/Abel-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'AbelCustom', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1240px;
      padding: 20px 24px 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      font-weight: normal;
      color: #ffffff;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label.control-label {
      font-size: 0.95rem;
      color: #cccccc;
    }

    select.bg-select {
      background-color: #111111;
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      padding: 8px 12px;
      font-family: 'AbelCustom', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
    }

    select.bg-select:hover,
    select.bg-select:focus {
      border-color: #ffffff;
    }

    .secondary-btn {
      background-color: rgba(255, 255, 255, 0.08);
      color: #eeeeee;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      font-family: 'AbelCustom', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .secondary-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .sr-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 6px 16px;
      font-size: 0.95rem;
      color: #dddddd;
      z-index: 10;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      display: inline-block;
      border-radius: 2px;
    }

    /* Relación de aspecto exacta 1.08 : 1 */
    #chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 1134px;
      aspect-ratio: 1.08 / 1;
      margin: 10px auto 30px;
      background-color: #000000;
      background-image: url('https://lupargraf.github.io/acme/Solar/fondosolar.jpg');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bar-label {
      font-family: 'AbelCustom', sans-serif;
      pointer-events: none;
      dominant-baseline: central;
      letter-spacing: 0.3px;
    }

    .leader-line {
      stroke: #ffffff;
      stroke-width: 1;
      fill: none;
      pointer-events: none;
    }

    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 8px 12px;
      font-size: 0.95rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    #status-msg {
      font-size: 0.95rem;
      color: #aaaaaa;
      text-align: center;
      margin-top: 4px;
      padding: 0 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>GRÁFICA SOLAR</h1>
    <div class="controls">
      <div class="control-group">
        <label for="bg-select" class="control-label">Fondo:</label>
        <select id="bg-select" class="bg-select" aria-label="Elegir fondo de la gráfica">
          <option value="black">negro</option>
          <option value="navy">azul marino</option>
          <option value="darkgreen">verde oscuro</option>
          <option value="purple">morado</option>
          <option value="maroon">granate</option>
          <option value="coffee">café</option>
          <option value="cme" selected>Fondo CME</option>
        </select>
        <button type="button" id="upload-bg-btn" class="secondary-btn" title="Elegir una imagen de fondo desde el equipo">Subir imagen</button>
        <input type="file" id="bg-file-input" class="sr-file-input" accept="image/*" />
      </div>

      <button type="button" id="load-file-btn" class="secondary-btn" title="Cargar tabla desde archivo Excel o CSV">Cargar tabla</button>
      <input type="file" id="table-file-input" class="sr-file-input" accept=".xlsx, .xls, .csv" />

      <button type="button" id="download-pdf-btn" class="secondary-btn" title="Descargar gráfico vectorial en PDF">Descargar PDF</button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="legend-color" style="background:#FFED00;"></span> Nivel 0</div>
    <div class="legend-item"><span class="legend-color" style="background:#F39200;"></span> Nivel 1</div>
    <div class="legend-item"><span class="legend-color" style="background:#1D71B8;"></span> Nivel 2</div>
    <div class="legend-item"><span class="legend-color" style="background:#3AAA35;"></span> Nivel 3</div>
    <div class="legend-item"><span class="legend-color" style="background:#BE1622;"></span> Nivel 4</div>
  </div>

  <div id="status-msg">Mostrando datos de ejemplo. Usa "Cargar tabla" para importar tu archivo.</div>

  <div id="chart-wrapper">
    <svg id="solar-chart" viewBox="0 0 1080 1000" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div id="tooltip"></div>

  <script>
    const LEVEL_COLORS = {
      0: '#FFED00',
      1: '#F39200',
      2: '#1D71B8',
      3: '#3AAA35',
      4: '#BE1622'
    };

    const SOLID_BACKGROUNDS = {
      black: '#000000',
      navy: '#081838',
      darkgreen: '#0B2E1A',
      purple: '#240C38',
      maroon: '#3B0914',
      coffee: '#2B160C'
    };

    const FONT_URL = 'https://lupargraf.github.io/acme/Solar/Abel-Regular.ttf';
    const CME_BG_URL = 'https://lupargraf.github.io/acme/Solar/fondosolar.jpg';

    // Dimensiones del PDF en puntos (relación 1.08 x 1, lado menor 3000)
    const PDF_HEIGHT = 3000;
    const PDF_WIDTH = Math.round(PDF_HEIGHT * 1.08); // 3240

    let currentBgMode = 'cme';
    let currentBgDataUrl = null;

    // 2 del nivel 0, 4 del nivel 1, 6 del nivel 2, 5 del nivel 3 y 4 del nivel 4
    const SAMPLE_DATA = [
      { nivel: 0, nombre: 'Atlético de Madrid', puntuacion: 153 },
      { nivel: 0, nombre: 'Real Betis Balompié', puntuacion: 74 },
      { nivel: 1, nombre: 'Real Club Celta de Vigo', puntuacion: 50 },
      { nivel: 1, nombre: 'Valencia Club de Fútbol', puntuacion: 261 },
      { nivel: 1, nombre: 'Real Sociedad de Fútbol', puntuacion: 363 },
      { nivel: 1, nombre: 'Deportivo de la Coruña', puntuacion: 134 },
      { nivel: 2, nombre: 'Deportivo Alavés', puntuacion: 241 },
      { nivel: 2, nombre: 'Elche Club de Fútbol', puntuacion: 182 },
      { nivel: 2, nombre: 'Sevilla Fútbol Club', puntuacion: 198 },
      { nivel: 2, nombre: 'Getafe Club de Fútbol', puntuacion: 221 },
      { nivel: 2, nombre: 'RCD Espanyol de Barcelona', puntuacion: 248 },
      { nivel: 2, nombre: 'Club Atlético Osasuna', puntuacion: 235 },
      { nivel: 3, nombre: 'Fútbol Club Villarreal', puntuacion: 341 },
      { nivel: 3, nombre: 'Rayo Vallecano', puntuacion: 229 },
      { nivel: 3, nombre: 'Real Madrid', puntuacion: 243 },
      { nivel: 3, nombre: 'Fútbol Club Barcelona', puntuacion: 356 },
      { nivel: 3, nombre: 'Levante Fútbol Club', puntuacion: 115 },
      { nivel: 4, nombre: 'Manchester United', puntuacion: 50 },
      { nivel: 4, nombre: 'París Saint-Germain', puntuacion: 418 },
      { nivel: 4, nombre: 'Club Montañero de Estudiantes', puntuacion: 374 },
      { nivel: 4, nombre: 'Asociación Cultural y Deportiva Alayos', puntuacion: 326 }
    ];

    const svg = d3.select('#solar-chart');
    const tooltip = d3.select('#tooltip');
    const chartWrapper = document.getElementById('chart-wrapper');
    const statusMsg = document.getElementById('status-msg');
    const bgSelect = document.getElementById('bg-select');
    const uploadBgBtn = document.getElementById('upload-bg-btn');
    const bgFileInput = document.getElementById('bg-file-input');
    const tableFileInput = document.getElementById('table-file-input');

    function applyBackground(mode, customDataUrl = null) {
      if (SOLID_BACKGROUNDS[mode]) {
        currentBgMode = mode;
        currentBgDataUrl = null;
        chartWrapper.style.backgroundColor = SOLID_BACKGROUNDS[mode];
        chartWrapper.style.backgroundImage = 'none';
        chartWrapper.style.backgroundSize = '100% 100%';
      } else if (mode === 'custom' && customDataUrl) {
        currentBgMode = 'custom';
        currentBgDataUrl = customDataUrl;
        chartWrapper.style.backgroundColor = '#000000';
        chartWrapper.style.backgroundImage = `url("${customDataUrl}")`;
        chartWrapper.style.backgroundSize = 'contain';
      } else {
        currentBgMode = 'cme';
        currentBgDataUrl = null;
        chartWrapper.style.backgroundColor = '#000000';
        chartWrapper.style.backgroundImage = `url("${CME_BG_URL}")`;
        chartWrapper.style.backgroundSize = '100% 100%';
      }
    }

    bgSelect.addEventListener('change', function() {
      applyBackground(this.value);
    });

    uploadBgBtn.addEventListener('click', function() {
      bgFileInput.value = '';
      bgFileInput.click();
    });

    bgFileInput.addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        applyBackground('custom', evt.target.result);
        statusMsg.textContent = `Fondo personalizado "${file.name}" aplicado conservando su proporción.`;
      };
      reader.readAsDataURL(file);
    });

    function measureSvgTextWidth(text, fontSize) {
      const tempText = svg.append('text')
        .attr('class', 'bar-label')
        .attr('font-family', "'AbelCustom', sans-serif")
        .attr('font-size', `${fontSize}px`)
        .attr('letter-spacing', '0.3px')
        .style('opacity', 0)
        .text(text);
      const width = tempText.node().getComputedTextLength();
      tempText.remove();
      return width;
    }

    function renderSolarChart(rawData) {
      svg.selectAll('*').remove();

      if (!rawData || rawData.length === 0) {
        statusMsg.textContent = 'No se encontraron registros válidos en la tabla.';
        return;
      }

      const data = rawData
        .map((d, idx) => ({ ...d, originalIndex: idx }))
        .sort((a, b) => (a.nivel - b.nivel) || (a.originalIndex - b.originalIndex));

      const width = 1080;
      const height = 1000;
      const cx = width / 2;
      const cy = height / 2;

      const innerRadius = 56;
      const maxOuterRadius = 475;

      const maxScore = d3.max(data, d => d.puntuacion) || 100;

      const rScale = d3.scaleLinear()
        .domain([0, maxScore])
        .range([innerRadius, maxOuterRadius]);

      const n = data.length;
      const totalAngle = 2 * Math.PI;
      const stepAngle = totalAngle / n;
      const barAngle = stepAngle / 1.1;

      const useDenseLayout = n >= 100;
      const meanBarLength = d3.mean(data, d => rScale(d.puntuacion) - innerRadius) || 0;
      const meanOuterRadius = innerRadius + meanBarLength;

      const innerArcWidth = innerRadius * barAngle;
      const fontSize = useDenseLayout
        ? Math.max(8, Math.min(16.5, innerArcWidth * 1.95))
        : Math.max(6.5, Math.min(12.5, innerArcWidth * 1.45));

      const g = svg.append('g')
        .attr('transform', `translate(${cx}, ${cy})`);

      g.append('circle')
        .attr('r', innerRadius - 1)
        .attr('fill', '#000000');

      const arcGenerator = d3.arc()
        .innerRadius(innerRadius)
        .outerRadius(d => rScale(d.puntuacion))
        .startAngle((d, i) => i * stepAngle)
        .endAngle((d, i) => i * stepAngle + barAngle);

      g.selectAll('.bar')
        .data(data)
        .enter()
        .append('path')
        .attr('class', 'bar')
        .attr('d', arcGenerator)
        .attr('fill', d => LEVEL_COLORS[d.nivel] || '#FFFFFF')
        .style('cursor', 'pointer')
        .on('mouseover', function(event, d) {
          d3.select(this).style('opacity', 0.85);
          tooltip
            .style('opacity', 1)
            .html(`<strong>${d.nombre}</strong><br/>Nivel ${d.nivel} · Puntuación: ${d.puntuacion}`);
        })
        .on('mousemove', function(event) {
          tooltip
            .style('left', `${event.clientX + 14}px`)
            .style('top', `${event.clientY - 20}px`);
        })
        .on('mouseout', function() {
          d3.select(this).style('opacity', 1);
          tooltip.style('opacity', 0);
        });

      const lineGapFromBar = 4;
      const textGapFromLine = 4;
      const padding = 5;

      data.forEach((d, i) => {
        const midAngle = i * stepAngle + barAngle / 2;
        const barOuterR = rScale(d.puntuacion);
        const barLength = barOuterR - innerRadius;
        const isShorterThanMean = useDenseLayout && (barLength < meanBarLength);

        const normalizedAngle = ((midAngle % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
        const isRightHalf = normalizedAngle < Math.PI;

        const labelText = isRightHalf
          ? `${d.nombre} ${d.puntuacion}`
          : `${d.puntuacion} ${d.nombre}`;

        const textWidth = measureSvgTextWidth(labelText, fontSize);
        const fitsInside = !isShorterThanMean && (barLength > (textWidth + padding * 2));

        const textColor = (d.nivel === 0 && fitsInside) ? '#000000' : '#ffffff';

        const angleDeg = (normalizedAngle * 180 / Math.PI) - 90;

        let radiusPos;
        let textAnchor;
        let finalRotation;

        if (isShorterThanMean) {
          const lineStartR = barOuterR + lineGapFromBar;
          const lineEndR = Math.max(lineStartR + 2, meanOuterRadius);

          if (lineEndR > lineStartR) {
            const x1 = Math.sin(normalizedAngle) * lineStartR;
            const y1 = -Math.cos(normalizedAngle) * lineStartR;
            const x2 = Math.sin(normalizedAngle) * lineEndR;
            const y2 = -Math.cos(normalizedAngle) * lineEndR;

            g.append('line')
              .attr('class', 'leader-line')
              .attr('x1', x1)
              .attr('y1', y1)
              .attr('x2', x2)
              .attr('y2', y2)
              .attr('stroke', '#ffffff')
              .attr('stroke-width', 1);
          }

          radiusPos = lineEndR + textGapFromLine;
          if (isRightHalf) {
            finalRotation = angleDeg;
            textAnchor = 'start';
          } else {
            finalRotation = angleDeg + 180;
            textAnchor = 'end';
          }
        } else if (isRightHalf) {
          finalRotation = angleDeg;
          if (fitsInside) {
            radiusPos = barOuterR - padding;
            textAnchor = 'end';
          } else {
            radiusPos = barOuterR + padding;
            textAnchor = 'start';
          }
        } else {
          finalRotation = angleDeg + 180;
          if (fitsInside) {
            radiusPos = barOuterR - padding;
            textAnchor = 'start';
          } else {
            radiusPos = barOuterR + padding;
            textAnchor = 'end';
          }
        }

        const x = Math.sin(normalizedAngle) * radiusPos;
        const y = -Math.cos(normalizedAngle) * radiusPos;

        g.append('text')
          .attr('class', 'bar-label')
          .attr('transform', `translate(${x}, ${y}) rotate(${finalRotation})`)
          .attr('text-anchor', textAnchor)
          .attr('dominant-baseline', 'central')
          .attr('fill', textColor)
          .attr('font-family', "'AbelCustom', sans-serif")
          .attr('font-size', `${fontSize}px`)
          .attr('letter-spacing', '0.3px')
          .text(labelText);
      });
    }

    function parseWorkbookFirstThreeCols(arrayBuffer) {
      const data = new Uint8Array(arrayBuffer);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];

      const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
      if (!rows || rows.length === 0) return [];

      const parsed = [];

      const firstRow = rows[0] || [];
      const col1First = String(firstRow[0] ?? '').trim().toLowerCase();
      const col2First = String(firstRow[1] ?? '').trim().toLowerCase();
      const startRowIndex = (col1First === 'nivel' || col2First === 'nombre') ? 1 : 0;

      for (let r = startRowIndex; r < rows.length; r++) {
        const row = rows[r] || [];
        const rawNivel = row[0];
        const rawNombre = row[1];
        const rawPuntuacion = row[2];

        const nombre = String(rawNombre ?? '').trim();

        if (!nombre) {
          break;
        }

        const nivelNum = Number(String(rawNivel ?? '').trim().replace(',', '.'));
        const nivel = Number.isInteger(nivelNum) ? nivelNum : Math.trunc(nivelNum);
        const puntuacion = parseFloat(String(rawPuntuacion ?? '0').replace(',', '.'));

        if (!isNaN(nivel) && nivel >= 0 && nivel <= 4) {
          parsed.push({
            nivel,
            nombre,
            puntuacion: isNaN(puntuacion) ? 0 : puntuacion
          });
        }
      }

      return parsed;
    }

    document.getElementById('load-file-btn').addEventListener('click', () => {
      tableFileInput.value = '';
      tableFileInput.click();
    });

    tableFileInput.addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const rows = parseWorkbookFirstThreeCols(evt.target.result);
          if (rows.length > 0) {
            statusMsg.textContent = `Archivo "${file.name}" cargado (${rows.length} registros).`;
            renderSolarChart(rows);
          } else {
            statusMsg.textContent = `No se encontraron datos válidos en las 3 primeras columnas de "${file.name}".`;
          }
        } catch (err) {
          console.error(err);
          statusMsg.textContent = `Error al leer el archivo "${file.name}".`;
        }
      };
      reader.readAsArrayBuffer(file);
    });

    async function getEmbeddedFontDataUrl() {
      try {
        const response = await fetch(FONT_URL);
        if (!response.ok) return '';
        const blob = await response.blob();
        return await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result || '');
          reader.onerror = () => resolve('');
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        return '';
      }
    }

    function loadImageElement(src, useCors = false) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        if (useCors) {
          img.crossOrigin = 'anonymous';
        }
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    document.getElementById('download-pdf-btn').addEventListener('click', async function() {
      const btn = this;
      const originalText = btn.textContent;
      btn.textContent = 'Generando PDF...';
      btn.disabled = true;

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: 'landscape',
          unit: 'pt',
          format: [PDF_WIDTH, PDF_HEIGHT]
        });

        const bgHex = SOLID_BACKGROUNDS[currentBgMode] || '#000000';
        doc.setFillColor(bgHex);
        doc.rect(0, 0, PDF_WIDTH, PDF_HEIGHT, 'F');

        if (currentBgMode === 'custom' && currentBgDataUrl) {
          try {
            const bgImg = await loadImageElement(currentBgDataUrl, false);
            const imgW = bgImg.naturalWidth || bgImg.width;
            const imgH = bgImg.naturalHeight || bgImg.height;
            if (imgW && imgH) {
              const scale = Math.min(PDF_WIDTH / imgW, PDF_HEIGHT / imgH);
              const drawW = imgW * scale;
              const drawH = imgH * scale;
              const offsetX = (PDF_WIDTH - drawW) / 2;
              const offsetY = (PDF_HEIGHT - drawH) / 2;
              doc.addImage(currentBgDataUrl, offsetX, offsetY, drawW, drawH);
            }
          } catch (e) {
            // Continuar con el color sólido de respaldo
          }
        } else if (!SOLID_BACKGROUNDS[currentBgMode]) {
          try {
            const bgImg = await loadImageElement(CME_BG_URL, true);
            const canvas = document.createElement('canvas');
            canvas.width = PDF_WIDTH;
            canvas.height = PDF_HEIGHT;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bgImg, 0, 0, PDF_WIDTH, PDF_HEIGHT);
            doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, PDF_WIDTH, PDF_HEIGHT);
          } catch (e) {
            // Continuar si el fondo externo no se puede cargar
          }
        }

        const svgElement = document.getElementById('solar-chart');
        const clonedSvg = svgElement.cloneNode(true);
        clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clonedSvg.setAttribute('width', String(PDF_WIDTH));
        clonedSvg.setAttribute('height', String(PDF_HEIGHT));

        const fontDataUrl = await getEmbeddedFontDataUrl();
        if (fontDataUrl) {
          const base64Font = fontDataUrl.split(',')[1];
          if (base64Font) {
            doc.addFileToVFS('Abel-Regular.ttf', base64Font);
            doc.addFont('Abel-Regular.ttf', 'AbelCustom', 'normal');
            doc.setFont('AbelCustom', 'normal');
          }
        }

        await doc.svg(clonedSvg, {
          x: 0,
          y: 0,
          width: PDF_WIDTH,
          height: PDF_HEIGHT
        });

        doc.save('grafica-solar.pdf');
      } catch (err) {
        console.error(err);
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });

    document.fonts.ready.then(() => {
      applyBackground('cme');
      renderSolarChart(SAMPLE_DATA);
    });
  </script>
</body>
</html>
