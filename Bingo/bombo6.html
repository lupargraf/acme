<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombo de Sorteo</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #bombo-container {
            cursor: pointer;
            width: 90vmin; /* Ocupa el 90% del lado más pequeño de la pantalla */
            height: 90vmin;
        }
        #bombo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="bombo-container" onclick="controlarBombo()">
        <img id="bombo-img" src="./Bombo/Bombo01.png" alt="Bombo">
    </div>

    <!-- Elemento de audio -->
    <audio id="audio-giro" src="./Bombo/audiogiro.mp3" loop></audio>

    <script>
        const totalFrames = 84;
        const stopFrame = 44;
        let currentFrame = 1;
        let isSpinning = false;
        let isStopping = false;
        
        const imgElement = document.getElementById('bombo-img');
        const audioGiro = document.getElementById('audio-giro');
        const baseUrl = './Bombo/';

        // Precarga de imágenes
        for (let i = 1; i <= totalFrames; i++) {
            const img = new Image();
            const num = i.toString().padStart(2, '0');
            img.src = `${baseUrl}Bombo${num}.png`;
        }

        function updateImage() {
            const num = currentFrame.toString().padStart(2, '0');
            imgElement.src = `${baseUrl}Bombo${num}.png`;
        }

        function tick() {
            if (!isSpinning && !isStopping) return;

            currentFrame++;
            if (currentFrame > totalFrames) currentFrame = 1;

            updateImage();

            if (isStopping && currentFrame === stopFrame) {
                isSpinning = false;
                isStopping = false;
                audioGiro.pause();
                audioGiro.currentTime = 0; // Reinicia el audio para la próxima vez
                return;
            }

            setTimeout(tick, 40);
        }

        function controlarBombo() {
            if (!isSpinning && !isStopping) {
                isSpinning = true;
                // Reproducir audio (con control de errores por si el navegador lo bloquea)
                audioGiro.play().catch(e => console.log("Audio bloqueado por el navegador"));
                tick();
            } else if (isSpinning && !isStopping) {
                isSpinning = false;
                isStopping = true;
            }
        }
    </script>
</body>
</html>
