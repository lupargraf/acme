<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo del Bronx</title>
    <style>
        @import url('<unsafe_url>https://fonts.googleapis.com/css2?family=Impact&display=swap'</unsafe_url>);
        
        body {
            background-color: #006633;
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'Impact', sans-serif;
            overflow: hidden;
        }

        #zona-izquierda {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .titulo {
            color: #FFD700;
            -webkit-text-stroke: 2px #FF0000;
            font-size: 5vw;
            margin-bottom: 20px;
        }
        
        #tablero {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 800px;
        }

        .casilla {
            aspect-ratio: 1;
            background-color: #2FAC66;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2vw;
            color: white;
            position: relative;
        }
        
        #zona-derecha {
            width: 45vw;
            background-color: white;
            border-left: 10px solid #FF0000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #bombo-container {
            width: 80%;
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
        }

        #bombo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .texto-contador {
            color: #015696;
            font-size: 4vw;
            margin-top: 20px;
        }

        #bola-animada {
            position: absolute;
            width: 60px;
            height: 60px;
            background-image: url('./Bombo/bola.png');
            background-size: cover;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: black;
            z-index: 100;
            transition: all 1s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="zona-izquierda">
        <div class="titulo">BINGO DEL BRONX</div>
        <div id="tablero"></div>
    </div>

    <div id="zona-derecha">
        <div id="bombo-container" onclick="controlarBombo()">
            <img id="bombo-img" src="./Bombo/Bombo01.png">
            <div id="bola-animada"></div>
        </div>
        <div class="texto-contador">Bolas extraídas: <span id="contador">0</span></div>
    </div>

    <audio id="audio-giro" src="./Bombo/audiogiro2.mp3" loop></audio>

    <script>
        const totalFrames = 84;
        const stopFrame = 44;
        let currentFrame = 1;
        let isSpinning = false;
        let isStopping = false;
        let isAnimating = false;
        let bolasDisponibles = Array.from({length: 90}, (_, i) => i + 1);
        let bolasExtraidas = 0;
        
        const imgElement = document.getElementById('bombo-img');
        const audioGiro = document.getElementById('audio-giro');
        const tablero = document.getElementById('tablero');
        const bolaAnimada = document.getElementById('bola-animada');
        const bomboContainer = document.getElementById('bombo-container');

        for(let i = 1; i <= 90; i++) {
            let c = document.createElement('div');
            c.className = 'casilla';
            <unsafe_url>c.id</unsafe_url> = `casilla-${i}`;
            c.innerText = i;
            tablero.appendChild(c);
        }

        function updateImage() {
            const num = currentFrame.toString().padStart(2, '0');
            imgElement.src = `./Bombo/Bombo${num}.png`;
        }

        function tick() {
            if (!isSpinning && !isStopping) return;
            
            currentFrame = currentFrame >= totalFrames ? 1 : currentFrame + 1;
            updateImage();

            if (isStopping && currentFrame === stopFrame) {
                isSpinning = false;
                isStopping = false;
                audioGiro.pause();
                audioGiro.currentTime = 0;
                sacarBola();
                return;
            }
            
            setTimeout(tick, 40);
        }

        function sacarBola() {
            if(bolasDisponibles.length === 0) return;
            
            let randIndex = Math.floor(Math.random() * bolasDisponibles.length);
            let numero = bolasDisponibles.splice(randIndex, 1)[0];
            
            bolasExtraidas++;
            document.getElementById('contador').innerText = bolasExtraidas;

            bolaAnimada.innerText = numero;
            bolaAnimada.style.display = 'flex';
            bolaAnimada.style.left = '45%';
            bolaAnimada.style.top = '78%';
            bolaAnimada.style.transform = 'translate(-50%, -50%) scale(1)';

            setTimeout(() => {
                bolaAnimada.style.transform = 'translate(-50%, -50%) scale(2)';
                
                setTimeout(() => {
                    let casilla = document.getElementById(`casilla-${numero}`);
                    let rectCasilla = casilla.getBoundingClientRect();
                    let rectBombo = bomboContainer.getBoundingClientRect();
                    
                    let destX = rectCasilla.left - rectBombo.left + (rectCasilla.width / 2) - 30;
                    let destY = rectCasilla.top - rectBombo.top + (rectCasilla.height / 2) - 30;

                    bolaAnimada.style.left = `${destX}px`;
                    bolaAnimada.style.top = `${destY}px`;
                    bolaAnimada.style.transform = 'scale(1)';

                    setTimeout(() => {
                        casilla.style.backgroundImage = "url('./Bombo/bola.png')";
                        casilla.style.backgroundSize = "cover";
                        casilla.style.color = "black";
                        bolaAnimada.style.display = 'none';
                        isAnimating = false;
                    }, 1000);
                }, 1000);
            }, 100);
        }

        function controlarBombo() {
            if(isAnimating || bolasDisponibles.length === 0) return;
            
            if (!isSpinning && !isStopping) {
                isSpinning = true; 
                audioGiro.play().catch(e => {});
                tick();
            } else if (isSpinning && !isStopping) {
                isStopping = true;
                isAnimating = true;
            }
        }
    </script>
</body>
</html>
