<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo del Bronx</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --verde-fondo: #006633;
      --verde-casilla: #2fac66;
      --azul: #075b98;
      --rojo: #ed1c24;
      --amarillo: #ffdf00;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--verde-fondo);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    #tapete {
      width: min(100%, 1600px);
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(360px, .92fr);
      gap: 28px;
      align-items: stretch;
    }

    #zona-izquierda {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .titulo {
      color: var(--amarillo);
      -webkit-text-stroke: 2px var(--rojo);
      paint-order: stroke fill;
      font-size: clamp(34px, 5vw, 76px);
      line-height: 1;
      letter-spacing: 1px;
      white-space: nowrap;
      margin: 0 0 24px;
      text-shadow: 2px 3px 0 rgba(0,0,0,.12);
    }

    #tablero {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: clamp(6px, 1vw, 15px);
      width: 100%;
    }

    .casilla {
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 50%;
      background: var(--verde-casilla);
      display: flex;
      justify-content: center;
      align-items: center;
      color: transparent;
      font: 700 clamp(12px, 1.5vw, 23px)/1 Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    .casilla.extraida {
      color: #071d2c;
      background:
        radial-gradient(circle at 32% 25%, #fff 0 5%, #d9f1ff 17%, #8ec8ed 45%, #397eae 78%, #15517d 100%);
      box-shadow: inset -4px -5px 8px rgba(0,0,0,.25),
                  inset 3px 3px 7px rgba(255,255,255,.65),
                  0 2px 4px rgba(0,0,0,.2);
      text-shadow: 0 1px 1px rgba(255,255,255,.8);
    }

    #zona-derecha {
      min-width: 0;
      background: #fff;
      border: 5px solid var(--rojo);
      padding: clamp(16px, 2.2vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    #bombo-container {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 1;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: grid;
      place-items: center;
      outline: none;
    }

    #bombo-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    #bombo-container:focus-visible {
      outline: 4px solid #075b98;
      outline-offset: 5px;
      border-radius: 12px;
    }

    .texto-contador {
      color: var(--azul);
      font-size: clamp(25px, 3.7vw, 54px);
      text-align: center;
      line-height: 1.1;
      margin-top: 28px;
      white-space: nowrap;
    }

    #bola-voladora {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #071d2c;
      font: 800 24px/1 Arial, sans-serif;
      text-shadow: 0 1px 2px rgba(255,255,255,.9);
      background:
        url("./Bombo/bola.png") center / cover no-repeat,
        radial-gradient(circle at 32% 25%, #fff 0 5%, #d9f1ff 17%, #8ec8ed 45%, #397eae 78%, #15517d 100%);
      box-shadow: inset -4px -5px 8px rgba(0,0,0,.25),
                  inset 3px 3px 7px rgba(255,255,255,.65),
                  0 5px 12px rgba(0,0,0,.3);
      transform: translate(-50%, -50%);
      pointer-events: none;
      will-change: left, top, width, height, transform;
    }

    #ayuda {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 850px) {
      body { align-items: flex-start; }
      #tapete {
        grid-template-columns: 1fr;
        max-width: 700px;
      }
      .titulo {
        white-space: normal;
        text-align: center;
      }
      #zona-derecha { order: -1; }
      #bombo-container { max-width: 430px; }
      .texto-contador { margin-top: 12px; }
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      #tapete { gap: 18px; }
      #zona-derecha { padding: 12px; border-width: 4px; }
      #tablero { gap: 5px; }
      .casilla { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main id="tapete">
    <section id="zona-izquierda" aria-label="Tablero de números">
      <h1 class="titulo">BINGO DEL BRONX</h1>
      <div id="tablero"></div>
    </section>

    <section id="zona-derecha" aria-label="Bombo de bingo">
      <div id="bombo-container" role="button" tabindex="0"
           aria-label="Pulsa para iniciar el bombo y vuelve a pulsar para detenerlo"
           title="Pulsa para girar. Vuelve a pulsar para sacar una bola.">
        <img id="bombo-img" src="./Bombo/Bombo01.png" alt="Bombo de bingo">
      </div>
      <div class="texto-contador">Bolas extraídas: <span id="contador">0</span></div>
    </section>
  </main>

  <div id="ayuda" aria-live="polite"></div>
  <audio id="audio-giro" src="./Bombo/audiogiro2.mp3" loop preload="auto"></audio>

  <script>
    "use strict";

    // Se presupone esta estructura:
    // index.html
    // Bombo/Bombo01.png ... Bombo84.png
    // Bombo/bola.png
    // Bombo/audiogiro2.mp3

    const TOTAL_FRAMES = 84;
    const FRAME_PARADA = 44;
    const INTERVALO_GIRO = 40;

    const bomboContainer = document.getElementById("bombo-container");
    const bomboImg = document.getElementById("bombo-img");
    const audioGiro = document.getElementById("audio-giro");
    const tablero = document.getElementById("tablero");
    const contador = document.getElementById("contador");
    const ayuda = document.getElementById("ayuda");

    let frameActual = 1;
    let intervalo = null;
    let girando = false;
    let esperandoParada = false;
    let animandoBola = false;

    // Se barajan los números una sola vez: no puede repetirse ninguno.
    const bolasDisponibles = Array.from({ length: 90 }, (_, i) => i + 1);
    for (let i = bolasDisponibles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bolasDisponibles[i], bolasDisponibles[j]] = [bolasDisponibles[j], bolasDisponibles[i]];
    }

    let bolasExtraidas = 0;

    // Crear las 90 casillas.
    for (let numero = 1; numero <= 90; numero++) {
      const casilla = document.createElement("div");
      casilla.className = "casilla";
      casilla.id = `casilla-${numero}`;
      casilla.textContent = numero;
      casilla.setAttribute("aria-label", `Número ${numero}`);
      tablero.appendChild(casilla);
    }

    // Precargar los fotogramas para evitar parpadeos durante el giro.
    for (let frame = 1; frame <= TOTAL_FRAMES; frame++) {
      const imagen = new Image();
      imagen.src = rutaFrame(frame);
    }

    function rutaFrame(frame) {
      return `./Bombo/Bombo${String(frame).padStart(2, "0")}.png`;
    }

    function mostrarFrame(frame) {
      frameActual = frame;
      bomboImg.src = rutaFrame(frame);
    }

    function avanzarFrame() {
      frameActual = frameActual >= TOTAL_FRAMES ? 1 : frameActual + 1;
      mostrarFrame(frameActual);

      // La parada siempre se produce exactamente en Bombo44.png.
      if (esperandoParada && frameActual === FRAME_PARADA) {
        detenerBombo();
      }
    }

    function iniciarBombo() {
      if (bolasDisponibles.length === 0) {
        ayuda.textContent = "Ya se han extraído las 90 bolas.";
        return;
      }

      girando = true;
      esperandoParada = false;

      audioGiro.currentTime = 0;
      audioGiro.play().catch(() => {
        // Algunos navegadores pueden bloquear el audio; el juego sigue funcionando.
      });

      intervalo = window.setInterval(avanzarFrame, INTERVALO_GIRO);
    }

    function solicitarParada() {
      esperandoParada = true;
    }

    function detenerBombo() {
      window.clearInterval(intervalo);
      intervalo = null;
      girando = false;
      esperandoParada = false;

      // Asegurar que el fotograma visible sea el de parada.
      mostrarFrame(FRAME_PARADA);

      audioGiro.pause();
      audioGiro.currentTime = 0;

      // Bloquear nuevos clics durante la breve pausa previa a la extracción.
      animandoBola = true;
      // Dejar respirar un instante al fotograma parado antes de mostrar la bola.
      window.setTimeout(extraerBola, 180);
    }

    function crearBolaVoladora(numero, centroX, centroY) {
      const bola = document.createElement("div");
      bola.id = "bola-voladora";
      bola.textContent = numero;
      bola.style.left = `${centroX}px`;
      bola.style.top = `${centroY}px`;
      document.body.appendChild(bola);
      return bola;
    }

    async function extraerBola() {
      if (bolasDisponibles.length === 0) {
        ayuda.textContent = "Ya se han extraído las 90 bolas.";
        return;
      }

      animandoBola = true;

      // Sacar el siguiente número de la lista barajada.
      const numero = bolasDisponibles.pop();
      const casilla = document.getElementById(`casilla-${numero}`);

      const bomboRect = bomboImg.getBoundingClientRect();
      const casillaRect = casilla.getBoundingClientRect();

      // Calcular el tamaño real de la imagen dentro de su contenedor.
      const escala = Math.min(
        bomboRect.width / bomboImg.naturalWidth,
        bomboRect.height / bomboImg.naturalHeight
      );

      // Compensar posibles márgenes de object-fit: contain.
      const imagenWidth = bomboImg.naturalWidth * escala;
      const imagenHeight = bomboImg.naturalHeight * escala;
      const offsetX = (bomboRect.width - imagenWidth) / 2;
      const offsetY = (bomboRect.height - imagenHeight) / 2;

      // Posición exacta de la boca del bombo en Bombo44.png.
      const bocaX = bomboRect.left + offsetX + 320 * escala;
      const bocaY = bomboRect.top + offsetY + 563 * escala;

      // Centro del bombo.
      const centroX = bomboRect.left + offsetX + imagenWidth / 2;
      const centroY = bomboRect.top + offsetY + imagenHeight / 2;

      // Diámetro original de la bola, adaptado al tamaño del bombo.
      const diametroInicial = 60 * escala;

      const destinoX = casillaRect.left + casillaRect.width / 2;
      const destinoY = casillaRect.top + casillaRect.height / 2;

      const bola = crearBolaVoladora(numero, bocaX, bocaY);

      // Aparece en la boca con su tamaño original.
      bola.style.width = `${diametroInicial}px`;
      bola.style.height = `${diametroInicial}px`;

      // Pequeña pausa para apreciar la bola antes de iniciar el movimiento.
      await new Promise(resolve => setTimeout(resolve, 180));

      // Fase 1: sale de la boca y crece hasta el centro del bombo.
      const diametroGrande = Math.min(
        190 * escala,
        Math.max(125 * escala, bomboRect.width * 0.36)
      );

      await bola.animate([
        {
          left: `${bocaX}px`,
          top: `${bocaY}px`,
          width: `${diametroInicial}px`,
          height: `${diametroInicial}px`
        },
        {
          left: `${centroX}px`,
          top: `${centroY}px`,
          width: `${diametroGrande}px`,
          height: `${diametroGrande}px`
        }
      ], {
        duration: 650,
        easing: "cubic-bezier(.2,.8,.25,1)",
        fill: "forwards"
      }).finished;

      // Fase 2: desde el centro hasta su casilla, reduciendo su tamaño.
      await bola.animate([
        {
          left: `${centroX}px`,
          top: `${centroY}px`,
          width: `${diametroGrande}px`,
          height: `${diametroGrande}px`
        },
        {
          left: `${destinoX}px`,
          top: `${destinoY}px`,
          width: `${casillaRect.width}px`,
          height: `${casillaRect.height}px`
        }
      ], {
        duration: 950,
        easing: "cubic-bezier(.22,.7,.25,1)",
        fill: "forwards"
      }).finished;

      // Fase 2: se desplaza hasta su casilla mientras se hace pequeña.
      await bola.animate([
        {
          left: `${inicioX}px`,
          top: `${inicioY}px`,
          width: `${diametroGrande}px`,
          height: `${diametroGrande}px`,
          transform: "translate(-50%, -50%) scale(1)"
        },
        {
          left: `${destinoX}px`,
          top: `${destinoY}px`,
          width: `${Math.max(30, casillaRect.width)}px`,
          height: `${Math.max(30, casillaRect.height)}px`,
          transform: "translate(-50%, -50%) scale(1)"
        }
      ], {
        duration: 950,
        easing: "cubic-bezier(.22,.7,.25,1)",
        fill: "forwards"
      }).finished;

      // La bola queda representada en la casilla.
      casilla.classList.add("extraida");
      casilla.setAttribute("aria-label", `Número ${numero}, extraído`);
      bola.remove();

      bolasExtraidas++;
      contador.textContent = bolasExtraidas;
      ayuda.textContent = `Ha salido el número ${numero}.`;

      animandoBola = false;
    }

    function controlarBombo() {
      if (animandoBola) return;

      if (!girando) {
        iniciarBombo();
      } else if (!esperandoParada) {
        solicitarParada();
      }
    }

    bomboContainer.addEventListener("click", controlarBombo);
    bomboContainer.addEventListener("keydown", (evento) => {
      if (evento.key === "Enter" || evento.key === " ") {
        evento.preventDefault();
        controlarBombo();
      }
    });
  </script>
</body>
</html>
