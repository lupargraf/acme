<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombo de Sorteo con Imágenes</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            color: white;
        }
        #contenedor-bombo {
            position: relative;
            width: 500px; /* Ajusta al tamaño real de tus imágenes */
            height: 500px;
            margin-top: 50px;
            cursor: pointer;
        }
        .capa {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        #soporte {
            background-image: url('Soporte.png');
            z-index: 2; /* Queda por delante si los ejes lo requieren */
        }
        #bombo {
            background-image: url('Bombo_2.png');
            z-index: 1; /* Queda por detrás */
        }
        .girando {
            animation: girar 2s linear infinite;
        }
        @keyframes girar {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="contenedor-bombo" onclick="toggleGiro()">
        <!-- El bombo gira -->
        <div id="bombo" class="capa"></div>
        <!-- El soporte se queda quieto -->
        <div id="soporte" class="capa"></div>
    </div>

    <script>
        const bombo = document.getElementById('bombo');
        let girando = false;

        function toggleGiro() {
            if (!girando) {
                bombo.classList.add('girando');
                girando = true;
            } else {
                bombo.classList.remove('girando');
                girando = false;
            }
        }
    </script>
</body>
</html>
