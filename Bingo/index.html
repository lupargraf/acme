<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombo de Sorteo - Secuencia</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #bombo-container {
            cursor: pointer;
            width: 500px; /* Ajusta al tamaño de tus imágenes */
            height: 500px;
        }
        #bombo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="bombo-container">
        <img id="bombo-img" src="<unsafe_url>https://lupargraf.github.io/acme/Bingo/Bombo/Bombo01.png</unsafe_url>" alt="Bombo">
    </div>

    <script>
        const totalFrames = 84;
        const stopFrame = 44;
        let currentFrame = 1;
        let isSpinning = false;
        let isStopping = false;
        let animationId;
        const imgElement = document.getElementById('bombo-img');
        
        // Ruta base de las imágenes
        const baseUrl = '<unsafe_url>https://lupargraf.github.io/acme/Bingo/Bombo/'</unsafe_url>;

        // Precarga de imágenes para evitar parpadeos
        const images = [];
        for (let i = 1; i <= totalFrames; i++) {
            const img = new Image();
            const num = i.toString().padStart(2, '0');
            img.src = `${baseUrl}Bombo${num}.png`;
            images.push(img);
        }

        function updateImage() {
            const num = currentFrame.toString().padStart(2, '0');
            imgElement.src = `${baseUrl}Bombo${num}.png`;
        }

        function animate() {
            currentFrame++;
            if (currentFrame > totalFrames) {
                currentFrame = 1;
            }

            updateImage();

            if (isStopping && currentFrame === stopFrame) {
                isSpinning = false;
                isStopping = false;
                return; // Detiene la animación
            }

            // Control de velocidad (aprox 24 fps)
            setTimeout(() => {
                if (isSpinning || isStopping) {
                    animationId = requestAnimationFrame(animate);
                }
            }, 41);
        }

        document.getElementById('bombo-container').addEventListener('click', () => {
            if (!isSpinning && !isStopping) {
                // Empezar a girar
                isSpinning = true;
                animate();
            } else if (isSpinning && !isStopping) {
                // Ordenar parada
                isSpinning = false;
                isStopping = true;
            }
        });
    </script>
</body>
</html>
