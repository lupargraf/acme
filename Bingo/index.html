<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombo de Sorteo - Secuencia</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #bombo-container {
            cursor: pointer;
            width: 500px;
            height: 500px;
            /* Evita que se seleccione texto o se haga zoom al tocar en móviles */
            user-select: none;
            -webkit-user-select: none;
        }
        #bombo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Asegura que el contenedor reciba el toque */
        }
    </style>
</head>
<body>

    <div id="bombo-container">
        <img id="bombo-img" src="https://lupargraf.github.io/acme/Bingo/Bombo/Bombo01.png" alt="Bombo">
    </div>

    <script>
        const totalFrames = 84;
        const stopFrame = 44;
        let currentFrame = 1;
        let isSpinning = false;
        let isStopping = false;
        let lastTime = 0;
        const fps = 24;
        const frameInterval = 1000 / fps;
        
        const imgElement = document.getElementById('bombo-img');
        const baseUrl = '<unsafe_url>https://lupargraf.github.io/acme/Bingo/Bombo/'</unsafe_url>;

        // Precarga
        for (let i = 1; i <= totalFrames; i++) {
            const img = new Image();
            const num = i.toString().padStart(2, '0');
            img.src = `${baseUrl}Bombo${num}.png`;
        }

        function updateImage() {
            const num = currentFrame.toString().padStart(2, '0');
            imgElement.src = `${baseUrl}Bombo${num}.png`;
        }

        function animate(timestamp) {
            if (!isSpinning && !isStopping) return;

            if (!lastTime) lastTime = timestamp;
            const elapsed = timestamp - lastTime;

            if (elapsed > frameInterval) {
                lastTime = timestamp - (elapsed % frameInterval);

                currentFrame++;
                if (currentFrame > totalFrames) {
                    currentFrame = 1;
                }

                updateImage();

                if (isStopping && currentFrame === stopFrame) {
                    isSpinning = false;
                    isStopping = false;
                    return;
                }
            }

            requestAnimationFrame(animate);
        }

        function handleInteraction(e) {
            e.preventDefault(); // Evita comportamientos por defecto en móviles
            
            if (!isSpinning && !isStopping) {
                isSpinning = true;
                lastTime = 0;
                requestAnimationFrame(animate);
            } else if (isSpinning && !isStopping) {
                isSpinning = false;
                isStopping = true;
            }
        }

        const container = document.getElementById('bombo-container');
        
        // Evento para ratón
        container.addEventListener('click', handleInteraction);
        
        // Evento para pantallas táctiles
        container.addEventListener('touchstart', handleInteraction, { passive: false });
    </script>
</body>
</html>
