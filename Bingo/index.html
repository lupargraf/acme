<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bingo del Bronx</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --verde-fondo: #006633;
      --verde-casilla: #2fac66;
      --azul: #075b98;
      --rojo: #ed1c24;
      --amarillo: #ffdf00;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--verde-fondo);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    #tapete {
      width: min(100%, 1600px);
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(360px, .92fr);
      gap: 28px;
      align-items: stretch;
    }

    #zona-izquierda {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .titulo {
      color: var(--amarillo);
      -webkit-text-stroke: 2px var(--rojo);
      paint-order: stroke fill;
      font-size: clamp(34px, 5vw, 76px);
      line-height: 1;
      letter-spacing: 1px;
      white-space: nowrap;
      margin: 0 0 24px;
      text-shadow: 2px 3px 0 rgba(0,0,0,.12);
    }

    #tablero {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: clamp(6px, 1vw, 15px);
      width: 100%;
    }

    .casilla {
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 50%;
      background: var(--verde-casilla);
      display: flex;
      justify-content: center;
      align-items: center;
      color: transparent;
      font: 700 clamp(12px, 1.5vw, 23px)/1 Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    .casilla.extraida {
      color: #071d2c;
      background:
        radial-gradient(circle at 32% 25%, #fff 0 5%, #d9f1ff 17%, #8ec8ed 45%, #397eae 78%, #15517d 100%);
      box-shadow: inset -4px -5px 8px rgba(0,0,0,.25),
                  inset 3px 3px 7px rgba(255,255,255,.65),
                  0 2px 4px rgba(0,0,0,.2);
      text-shadow: 0 1px 1px rgba(255,255,255,.8);
    }

    #zona-derecha {
      min-width: 0;
      background: #fff;
      border: 5px solid var(--rojo);
      padding: clamp(16px, 2.2vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    #bombo-container {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 1;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: grid;
      place-items: center;
      outline: none;
    }

    #bombo-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .texto-contador {
      color: var(--azul);
      font-size: clamp(25px, 3.7vw, 54px);
      text-align: center;
      line-height: 1.1;
      margin-top: 28px;
      white-space: nowrap;
    }

    #bola-voladora {
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #071d2c;
      font: 800 24px/1 Arial, sans-serif;
      text-shadow: 0 1px 2px rgba(255,255,255,.9);
      background:
        url("./Bombo/bola.png") center / cover no-repeat,
        radial-gradient(circle at 32% 25%, #fff 0 5%, #d9f1ff 17%, #8ec8ed 45%, #397eae 78%, #15517d 100%);
      box-shadow: inset -4px -5px 8px rgba(0,0,0,.25),
                  inset 3px 3px 7px rgba(255,255,255,.65),
                  0 5px 12px rgba(0,0,0,.3);
      transform: translate(-50%, -50%);
      pointer-events: none;
      will-change: left, top, width, height, transform;
    }
    
    /* ADAPTACIÓN A TABLETS Y MÓVILES */
    @media (max-width: 850px) {
      body {
        min-height: 100vh;
        min-height: 100svh;
        align-items: flex-start;
        padding: 12px;
      }

      #tapete {
        grid-template-columns: minmax(0, 1fr);
        max-width: 700px;
        gap: 20px;
      }

      #zona-derecha {
        order: -1;
        padding: 14px;
      }

      #bombo-container {
        width: min(100%, 430px);
      }

      .texto-contador {
        margin-top: 14px;
        font-size: clamp(24px, 6vw, 40px);
      }

      .titulo {
        white-space: normal;
        text-align: center;
        font-size: clamp(32px, 8vw, 58px);
      }

      #zona-izquierda {
        width: 100%;
      }

      #tablero {
        gap: clamp(3px, 1.2vw, 8px);
      }

      .casilla {
        font-size: clamp(9px, 2.5vw, 16px);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      #tapete {
        gap: 14px;
      }

      #zona-derecha {
        border-width: 4px;
        padding: 10px;
      }

      #bombo-container {
        width: min(100%, 360px);
      }

      #tablero {
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main id="tapete">
    <section id="zona-izquierda">
      <h1 class="titulo">BINGO DEL BRONX</h1>
      <div id="tablero"></div>
    </section>

    <section id="zona-derecha">
      <div id="bombo-container" role="button" tabindex="0">
  <video
  id="bombo-video"
  src="./Bombo/girobombo.mp4"
  poster="./Bombo/Bombo.jpg"
  loop
  autoplay
  playsinline
  webkit-playsinline
  preload="auto"
  muted>
</video>
      </div>
      <div class="texto-contador">Bolas extraídas: <span id="contador">0</span></div>
    </section>
  </main>

  <script>
"use strict";

// ==========================================
// COORDENADAS DE LA BOCA DEL BOMBO
// ==========================================
const BOCA_X_PX = 428;
const BOCA_Y_PX = 713;

// Dimensiones de referencia por si el vídeo aún no las proporciona.
const ANCHO_REFERENCIA = 820;
const ALTO_REFERENCIA = 720;

// ==========================================

const bomboContainer = document.getElementById("bombo-container");
const bomboVideo = document.getElementById("bombo-video");
const tablero = document.getElementById("tablero");
const contador = document.getElementById("contador");

let girando = false;
let esperandoParada = false;
let animandoBola = false;
let checkInterval = null;
let ultimoTiempoVideo = 0;

// Barajar las 90 bolas para evitar repeticiones.
const bolasDisponibles = Array.from(
  { length: 90 },
  (_, i) => i + 1
);

for (let i = bolasDisponibles.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [bolasDisponibles[i], bolasDisponibles[j]] =
    [bolasDisponibles[j], bolasDisponibles[i]];
}

let bolasExtraidas = 0;

// Crear tablero.
for (let numero = 1; numero <= 90; numero++) {
  const casilla = document.createElement("div");
  casilla.className = "casilla";
  casilla.id = `casilla-${numero}`;
  casilla.textContent = numero;
  tablero.appendChild(casilla);
}

// ==========================================
// INICIAR EL BOMBO
// ==========================================

function iniciarBombo() {
  if (bolasDisponibles.length === 0) return;

  girando = true;
  esperandoParada = false;

  ultimoTiempoVideo = bomboVideo.currentTime;

  // Reproducir el vídeo con su propio sonido.
  const reproduccion = bomboVideo.play();

  if (reproduccion && typeof reproduccion.catch === "function") {
    reproduccion.catch(error => {
      console.error("No se pudo reproducir el bombo:", error);

      clearInterval(checkInterval);
      checkInterval = null;

      girando = false;
      esperandoParada = false;
    });
  }

  // Vigilar el momento en que el vídeo completa una vuelta.
  clearInterval(checkInterval);

  checkInterval = setInterval(vigilarVideo, 50);
}

// ==========================================
// DETECTAR EL FINAL DE UNA VUELTA
// ==========================================

function vigilarVideo() {
  const tiempoActual = bomboVideo.currentTime;

  // Si el tiempo vuelve bruscamente hacia cero,
  // el vídeo ha completado una vuelta.
  if (
    esperandoParada &&
    tiempoActual < ultimoTiempoVideo - 0.25
  ) {
    detenerBombo();
    return;
  }

  ultimoTiempoVideo = tiempoActual;
}

// ==========================================
// SOLICITAR PARADA
// ==========================================

function solicitarParada() {
  esperandoParada = true;
}

// ==========================================
// DETENER EL BOMBO
// ==========================================

function detenerBombo() {
  clearInterval(checkInterval);
  checkInterval = null;

  bomboVideo.pause();

  // Dejar preparado el vídeo para la siguiente extracción.
  try {
    bomboVideo.currentTime = 0;
  } catch (error) {
    console.warn("No se pudo reiniciar la posición del vídeo.");
  }

  girando = false;
  esperandoParada = false;

  animandoBola = true;

  window.setTimeout(extraerBola, 180);
}

// ==========================================
// CREAR BOLA VOLADORA
// ==========================================

function crearBolaVoladora(numero, centroX, centroY) {
  const bola = document.createElement("div");

  bola.id = "bola-voladora";
  bola.textContent = numero;
  bola.style.left = `${centroX}px`;
  bola.style.top = `${centroY}px`;

  document.body.appendChild(bola);

  return bola;
}

// ==========================================
// EXTRAER Y ANIMAR LA BOLA
// ==========================================

async function extraerBola() {
  if (bolasDisponibles.length === 0) {
    animandoBola = false;
    return;
  }

  const numero = bolasDisponibles.pop();
  const casilla = document.getElementById(`casilla-${numero}`);

  const bomboRect = bomboVideo.getBoundingClientRect();
  const casillaRect = casilla.getBoundingClientRect();

  // Dimensiones reales del vídeo.
  const anchoVideo = bomboVideo.videoWidth || ANCHO_REFERENCIA;
  const altoVideo = bomboVideo.videoHeight || ALTO_REFERENCIA;

  // Escala de representación del vídeo.
  const escala = Math.min(
    bomboRect.width / anchoVideo,
    bomboRect.height / altoVideo
  );

  const imagenWidth = anchoVideo * escala;
  const imagenHeight = altoVideo * escala;

  // Compensar los márgenes de object-fit: contain.
  const offsetX = (bomboRect.width - imagenWidth) / 2;
  const offsetY = (bomboRect.height - imagenHeight) / 2;

  // Posición de salida de la bola.
  const bocaX =
    bomboRect.left + offsetX + BOCA_X_PX * escala;

  const bocaY =
    bomboRect.top + offsetY + BOCA_Y_PX * escala;

  // Centro del bombo.
  const centroX =
    bomboRect.left + offsetX + imagenWidth / 2;

  const centroY =
    bomboRect.top + offsetY + imagenHeight / 2;

  // Tamaño inicial de la bola.
  const diametroInicial = 60 * escala;

  // Destino en el tablero.
  const destinoX =
    casillaRect.left + casillaRect.width / 2;

  const destinoY =
    casillaRect.top + casillaRect.height / 2;

  const bola = crearBolaVoladora(numero, bocaX, bocaY);

  bola.style.width = `${diametroInicial}px`;
  bola.style.height = `${diametroInicial}px`;

  await new Promise(resolve => setTimeout(resolve, 180));

  // PRIMER MOVIMIENTO: boca -> centro del bombo.
  const diametroGrande = Math.min(
    190 * escala,
    Math.max(125 * escala, bomboRect.width * 0.36)
  );

  await bola.animate([
    {
      left: `${bocaX}px`,
      top: `${bocaY}px`,
      width: `${diametroInicial}px`,
      height: `${diametroInicial}px`
    },
    {
      left: `${centroX}px`,
      top: `${centroY}px`,
      width: `${diametroGrande}px`,
      height: `${diametroGrande}px`
    }
  ], {
    duration: 650,
    easing: "cubic-bezier(.2,.8,.25,1)",
    fill: "forwards"
  }).finished;

  // SEGUNDO MOVIMIENTO: centro -> casilla.
  await bola.animate([
    {
      left: `${centroX}px`,
      top: `${centroY}px`,
      width: `${diametroGrande}px`,
      height: `${diametroGrande}px`
    },
    {
      left: `${destinoX}px`,
      top: `${destinoY}px`,
      width: `${casillaRect.width}px`,
      height: `${casillaRect.height}px`
    }
  ], {
    duration: 950,
    easing: "cubic-bezier(.22,.7,.25,1)",
    fill: "forwards"
  }).finished;

  // Registrar la bola en el tablero.
  casilla.classList.add("extraida");
  casilla.setAttribute("aria-label", `Número ${numero}, extraído`);

  bola.remove();

  bolasExtraidas++;
  contador.textContent = bolasExtraidas;

  animandoBola = false;
}

// ==========================================
// CONTROL DEL BOMBO
// ==========================================

function controlarBombo() {
  if (animandoBola) return;

  if (!girando) {
    iniciarBombo();
  } else if (!esperandoParada) {
    solicitarParada();
  }
}

// Control táctil y ratón.
bomboContainer.addEventListener("click", controlarBombo);

// Control con teclado.
bomboContainer.addEventListener("keydown", evento => {
  if (evento.key === "Enter" || evento.key === " ") {
    evento.preventDefault();
    controlarBombo();
  }
});
  </script>
</body>
</html>
