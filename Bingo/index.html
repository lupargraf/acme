<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombo de Sorteo - Eje Corregido</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            color: white;
        }
        #contenedor-bombo {
            position: relative;
            width: 600px; /* Ajustado para dar margen */
            height: 600px;
            margin-top: 50px;
            cursor: pointer;
        }
        .capa {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        #soporte {
            background-image: url('Soporte.png');
            z-index: 2;
        }
        #bombo {
            background-image: url('Bombo_2.png');
            z-index: 1;
            /* AJUSTE CLAVE: Define el punto exacto de giro (X, Y) */
            /* Si el eje no queda perfecto, modifica estos porcentajes */
            transform-origin: 41.5% 37%; 
        }
        .girando {
            animation: girar 3s linear infinite;
        }
        @keyframes girar {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="contenedor-bombo" onclick="toggleGiro()">
        <div id="bombo" class="capa"></div>
        <div id="soporte" class="capa"></div>
    </div>

    <script>
        const bombo = document.getElementById('bombo');
        let girando = false;

        function toggleGiro() {
            if (!girando) {
                bombo.classList.add('girando');
                girando = true;
            } else {
                bombo.classList.remove('girando');
                girando = false;
            }
        }
    </script>
</body>
</html>
