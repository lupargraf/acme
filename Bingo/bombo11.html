<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo del Bronx</title>
    <style>
        @import url('<unsafe_url>https://fonts.googleapis.com/css2?family=Impact&display=swap'</unsafe_url>);
        
        body {
            background-color: #111;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Impact', sans-serif;
        }

        #tapete {
            width: 2000px;
            height: 1175px;
            background-color: #006633;
            position: relative;
            transform-origin: top left;
        }

        .titulo {
            color: #FFD700;
            -webkit-text-stroke: 3px #FF0000;
            font-size: 90px;
            position: absolute;
            top: 60px;
            left: 50px;
            letter-spacing: 2px;
        }

        #panel-derecho {
            position: absolute;
            right: 50px;
            top: 50px;
            width: 815px;
            height: 1070px;
            background-color: white;
            border: 10px solid #FF0000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #bombo-container {
            width: 718px;
            height: 720px;
            position: relative;
            cursor: pointer;
        }

        #bombo-img { width: 100%; height: 100%; }

        #bola-animada {
            position: absolute;
            width: 60px;
            height: 60px;
            background-image: url('./Bombo/bola.png');
            background-size: cover;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: black;
            z-index: 10;
            transition: all 1s ease-in-out;
        }

        .texto-contador {
            color: #015696;
            font-size: 60px;
            margin-top: 50px;
        }

        #tablero {
            position: absolute;
            left: 50px;
            top: 220px;
            display: grid;
            grid-template-columns: repeat(10, 80px);
            grid-gap: 15px;
            width: 935px; /* Corrección clave para que quepan las 10 columnas */
        }

        .casilla {
            width: 80px;
            height: 80px;
            background-color: #2FAC66;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
        }
    </style>
</head>
<body>

    <div id="tapete">
        <div class="titulo">BINGO DEL BRONX</div>
        
        <div id="tablero"></div>

        <div id="panel-derecho">
            <div id="bombo-container" onclick="controlarBombo()">
                <img id="bombo-img" src="./Bombo/Bombo01.png">
                <div id="bola-animada"></div>
            </div>
            <div class="texto-contador">Bolas extraídas: <span id="contador">0</span></div>
        </div>
    </div>

    <audio id="audio-giro" src="./Bombo/audiogiro2.mp3" loop></audio>

    <script>
        function resize() {
            const scale = Math.min(window.innerWidth / 2000, window.innerHeight / 1175);
            document.getElementById('tapete').style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resize); resize();

        const totalFrames = 84, stopFrame = 44;
        let currentFrame = 1, isSpinning = false, isStopping = false, isAnimating = false;
        let bolasDisponibles = Array.from({length: 90}, (_, i) => i + 1);
        let bolasExtraidas = 0;
        
        const imgElement = document.getElementById('bombo-img');
        const audioGiro = document.getElementById('audio-giro');
        const bolaAnimada = document.getElementById('bola-animada');
        const tablero = document.getElementById('tablero');

        for(let i=1; i<=90; i++) {
            let c = document.createElement('div');
            c.className = 'casilla'; <unsafe_url>c.id</unsafe_url> = `casilla-${i}`; c.innerText = i;
            tablero.appendChild(c);
        }

        function updateImage() {
            imgElement.src = `./Bombo/Bombo${currentFrame.toString().padStart(2, '0')}.png`;
        }

        function tick() {
            if (!isSpinning && !isStopping) return;
            currentFrame = currentFrame >= totalFrames ? 1 : currentFrame + 1;
            updateImage();

            if (isStopping && currentFrame === stopFrame) {
                isSpinning = false; isStopping = false;
                audioGiro.pause(); audioGiro.currentTime = 0;
                sacarBola();
                return;
            }
            setTimeout(tick, 40);
        }

        function sacarBola() {
            if(bolasDisponibles.length === 0) return;
            
            let randIndex = Math.floor(Math.random() * bolasDisponibles.length);
            let numero = bolasDisponibles.splice(randIndex, 1)[0];
            
            bolasExtraidas++;
            document.getElementById('contador').innerText = bolasExtraidas;

            bolaAnimada.innerText = numero;
            bolaAnimada.style.display = 'flex';
            bolaAnimada.style.left = '320px';
            bolaAnimada.style.top = '563px';
            bolaAnimada.style.transform = 'scale(1)';

            setTimeout(() => {
                bolaAnimada.style.transform = 'scale(2)';
                
                setTimeout(() => {
                    let casilla = document.getElementById(`casilla-${numero}`);
                    let rectCasilla = casilla.getBoundingClientRect();
                    let rectBombo = document.getElementById('bombo-container').getBoundingClientRect();
                    
                    let destX = (rectCasilla.left - rectBombo.left) / (rectBombo.width / 718);
                    let destY = (rectCasilla.top - rectBombo.top) / (rectBombo.height / 720);

                    bolaAnimada.style.left = `${destX}px`;
                    bolaAnimada.style.top = `${destY}px`;
                    bolaAnimada.style.transform = 'scale(1.33)';

                    setTimeout(() => {
                        casilla.style.backgroundImage = "url('./Bombo/bola.png')";
                        casilla.style.backgroundSize = "cover";
                        casilla.style.color = "black";
                        bolaAnimada.style.display = 'none';
                        isAnimating = false; // Desbloquea el bombo
                    }, 1000);
                }, 1000);
            }, 100);
        }

        function controlarBombo() {
            if(isAnimating || bolasDisponibles.length === 0) return;
            
            if (!isSpinning && !isStopping) {
                isSpinning = true; 
                audioGiro.play().catch(e => {});
                tick();
            } else if (isSpinning && !isStopping) {
                isStopping = true;
                isAnimating = true; // Bloquea hasta que termine la animación
            }
        }
    </script>
</body>
</html>
