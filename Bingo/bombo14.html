<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo del Bronx</title>
    <style>
        @import url('<unsafe_url>https://fonts.googleapis.com/css2?family=Impact&display=swap'</unsafe_url>);
        
        body {
            background-color: #006633;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Impact', sans-serif;
        }

        #tapete {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }

        #zona-izquierda { flex: 1; }

        .titulo {
            color: #FFD700;
            -webkit-text-stroke: 2px #FF0000;
            font-size: 60px;
            margin-bottom: 20px;
        }

        #tablero {
            display: grid;
            grid-template-columns: repeat(10, 60px);
            grid-gap: 10px;
        }

        .casilla {
            width: 60px;
            height: 60px;
            background-color: #2FAC66;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
        }

        #zona-derecha {
            background: white;
            border: 5px solid red;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #bombo-container {
            width: 500px;
            height: 500px;
            cursor: pointer;
        }

        #bombo-img { width: 100%; height: 100%; }

        .texto-contador {
            color: #015696;
            font-size: 40px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="tapete">
        <div id="zona-izquierda">
            <div class="titulo">BINGO DEL BRONX</div>
            <div id="tablero"></div>
        </div>
        <div id="zona-derecha">
            <div id="bombo-container" onclick="controlarBombo()">
                <img id="bombo-img" src="./Bombo/Bombo01.png">
            </div>
            <div class="texto-contador">Bolas extraídas: <span id="contador">0</span></div>
        </div>
    </div>

    <audio id="audio-giro" src="./Bombo/audiogiro2.mp3" loop></audio>

    <script>
        const totalFrames = 84, stopFrame = 44;
        let currentFrame = 1, isSpinning = false, isStopping = false;
        let bolasDisponibles = Array.from({length: 90}, (_, i) => i + 1);
        let bolasExtraidas = 0;
        
        const imgElement = document.getElementById('bombo-img');
        const audioGiro = document.getElementById('audio-giro');
        const tablero = document.getElementById('tablero');

        for(let i=1; i<=90; i++) {
            let c = document.createElement('div');
            c.className = 'casilla'; <unsafe_url>c.id</unsafe_url> = `casilla-${i}`; c.innerText = i;
            tablero.appendChild(c);
        }

        function updateImage() {
            imgElement.src = `./Bombo/Bombo${currentFrame.toString().padStart(2, '0')}.png`;
        }

        function tick() {
            if (!isSpinning && !isStopping) return;
            currentFrame = currentFrame >= totalFrames ? 1 : currentFrame + 1;
            updateImage();

            if (isStopping && currentFrame === stopFrame) {
                isSpinning = false; isStopping = false;
                audioGiro.pause(); audioGiro.currentTime = 0;
                sacarBola();
                return;
            }
            setTimeout(tick, 40);
        }

        function sacarBola() {
            if(bolasDisponibles.length === 0) return;
            let randIndex = Math.floor(Math.random() * bolasDisponibles.length);
            let numero = bolasDisponibles.splice(randIndex, 1)[0];
            
            bolasExtraidas++;
            document.getElementById('contador').innerText = bolasExtraidas;

            let casilla = document.getElementById(`casilla-${numero}`);
            casilla.style.backgroundImage = "url('./Bombo/bola.png')";
            casilla.style.backgroundSize = "cover";
            casilla.style.color = "black";
        }

        function controlarBombo() {
            if (!isSpinning && !isStopping) {
                isSpinning = true; 
                audioGiro.play().catch(e => {});
                tick();
            } else if (isSpinning && !isStopping) {
                isStopping = true;
            }
        }
    </script>
</body>
</html>
