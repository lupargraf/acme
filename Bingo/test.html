<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test de JavaScript</title>
    <style>
        #caja {
            width: 200px; height: 200px;
            background-color: red; color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="caja" onclick="cambiar()">1</div>

    <script>
        let numero = 1;
        function cambiar() {
            numero++;
            document.getElementById('caja').innerText = numero;
            document.getElementById('caja').style.backgroundColor = numero % 2 === 0 ? 'blue' : 'red';
        }
    </script>
</body>
</html>
