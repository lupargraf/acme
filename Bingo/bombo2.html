<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombo de Sorteo</title>
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: sans-serif;
        }
        #bombo-container {
            cursor: pointer;
            width: 300px;
            height: 300px;
            touch-action: none; /* Evita que el móvil haga zoom o scroll al tocar */
        }
        #bombo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="bombo-container">
        <img id="bombo-img" src="https://lupargraf.github.io/acme/Bingo/Bombo/Bombo01.png" alt="Bombo">
    </div>
    <p id="estado">Estado: Detenido (Haz clic para girar)</p>

    <script>
        const totalFrames = 84;
        const stopFrame = 44;
        let currentFrame = 1;
        let isSpinning = false;
        let isStopping = false;
        
        const imgElement = document.getElementById('bombo-img');
        const estado = document.getElementById('estado');
        const baseUrl = '<unsafe_url>https://lupargraf.github.io/acme/Bingo/Bombo/'</unsafe_url>;

        function updateImage() {
            const num = currentFrame.toString().padStart(2, '0');
            imgElement.src = `${baseUrl}Bombo${num}.png`;
        }

        function tick() {
            if (!isSpinning && !isStopping) return;

            currentFrame++;
            if (currentFrame > totalFrames) currentFrame = 1;

            updateImage();

            if (isStopping && currentFrame === stopFrame) {
                isSpinning = false;
                isStopping = false;
                estado.innerText = "Estado: Detenido en fotograma 44";
                return;
            }

            setTimeout(tick, 40);
        }

        // pointerdown funciona para ratón, lápiz y dedos por igual
        document.getElementById('bombo-container').addEventListener('pointerdown', function(e) {
            e.preventDefault(); // Evita comportamientos extraños
            
            if (!isSpinning && !isStopping) {
                isSpinning = true;
                estado.innerText = "Estado: Girando...";
                tick();
            } else if (isSpinning && !isStopping) {
                isSpinning = false;
                isStopping = true;
                estado.innerText = "Estado: Frenando...";
            }
        });
    </script>
</body>
</html>
